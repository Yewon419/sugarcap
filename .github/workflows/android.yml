name: Android

# 서명 없는 컴파일 + JVM 테스트(SPEC §9.11). iOS 워크플로와 concurrency 그룹을 나눠 서로 취소하지 않는다.
on:
  push:
    branches: [main]
    # 앱이 data/catalog*.json을 그대로 번들한다. 카탈로그만 바뀐 푸시도 테스트를 돌린다.
    paths:
      - "android/**"
      - "data/catalog*.json"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - "data/catalog*.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 37.2
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" > /dev/null
      - name: Test and assemble
        run: ./gradlew test assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/reports/tests/
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
