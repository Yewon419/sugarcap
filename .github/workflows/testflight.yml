name: iOS

# private 리포의 macOS 러너는 분당 10배로 과금된다(무료 2,000분 = macOS 실질 200분).
# 그래서 푸시에는 서명 없는 컴파일 검증만 돌리고, TestFlight 업로드는 수동 실행으로만 연다.
on:
  push:
    branches: [main]
    paths:
      - "SugarCap/**"
      - ".github/workflows/testflight.yml"
  pull_request:
    paths:
      - "SugarCap/**"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 컴파일 + 테스트. 서명·시크릿 없이 돈다.
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: SugarCap
        run: xcodegen generate

      # 시뮬레이터 이름은 Xcode 버전마다 바뀐다. 이름을 박지 않고 있는 것 중에서 고른다.
      - name: 시뮬레이터 선택
        run: |
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items()):
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"], device["name"], sep="\t")
                      sys.exit(0)
          sys.exit(1)')
          echo "SIM_UDID=${UDID%%$'\t'*}" >> "$GITHUB_ENV"
          echo "선택: ${UDID#*$'\t'}"

      # 기록 루프 UI 테스트를 화면째 녹화한다(SPEC §8 Phase 1 게이트 "플로우 녹화").
      # 녹화는 부팅된 기기에만 붙으므로 xcodebuild보다 먼저 부팅하고, 테스트가 실패해도 영상은 닫는다.
      - name: 테스트 (서명 없음) + 플로우 녹화
        working-directory: SugarCap
        run: |
          mkdir -p "$RUNNER_TEMP/flow"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/flow/record-flow.mp4" &
          REC=$!
          sleep 2

          set +e
          xcodebuild test \
            -project SugarCap.xcodeproj \
            -scheme SugarCap \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
          STATUS=$?
          set -e

          # SIGINT여야 recordVideo가 mp4 헤더를 마저 쓰고 끝난다.
          kill -INT "$REC"
          wait "$REC" || true
          ls -la "$RUNNER_TEMP/flow"
          exit "$STATUS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-video
          path: ${{ runner.temp }}/flow
          retention-days: 14

      # UI 테스트가 실패하면 그 순간의 스크린샷이 xcresult에 들어 있다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7

      # 개발 환경에 Mac이 없어서 화면을 볼 수 있는 경로가 이것뿐이다(SPEC §8 Phase 1 게이트).
      # 테스트가 만든 .app을 그대로 설치해 찍는다. 재설치는 데이터를 지우지 않으므로
      # UI 테스트가 남긴 기록 2건(브랜드 메뉴 1 + 직접 입력 1)이 든 상태로 찍힌다.
      - name: 스크린샷
        working-directory: SugarCap
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/SugarCap.app
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"

          # 네 번째 인자부터는 앱 실행 인자다. `-key value`는 UserDefaults 인자 도메인으로 들어가
          # 저장 없이 그 실행에만 적용된다(`-initialTab settings`, `-onboardingCompleted NO`).
          shoot() {
            local name="$1" appearance="$2" size="$3"
            shift 3
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            xcrun simctl ui "$SIM_UDID" content_size "$size"
            xcrun simctl launch "$SIM_UDID" com.sugarcap.app "$@"
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/$name.png"
            xcrun simctl terminate "$SIM_UDID" com.sugarcap.app
          }

          shoot light light large
          # 표준 최대치(XXXL)를 넘는 접근성 크기로 레이아웃이 무너지는지 본다.
          shoot type-ax-xl light accessibility-extra-large
          shoot settings light large -initialTab settings
          shoot onboarding light large -onboardingCompleted NO
          shoot settings-type-ax-xl light accessibility-extra-large -initialTab settings
          shoot onboarding-type-ax-xl light accessibility-extra-large -onboardingCompleted NO
          # 마감 버튼은 저녁 이후에만 보여 러너 시각에 따라 닿지 못한다. Debug 빌드 전용 인자로 띄운다.
          shoot trends light large -initialTab trends
          shoot trends-type-ax-xl light accessibility-extra-large -initialTab trends
          shoot feeding light large -screenshotFeeding YES
          shoot paywall light large -mockPro YES -screenshotPaywall YES
          shoot paywall-type-ax-xl light accessibility-extra-large -mockPro YES -screenshotPaywall YES
          shoot affinity light large -mockProOwned YES -screenshotAffinity YES
          shoot feeding-type-ax-xl light accessibility-extra-large -screenshotFeeding YES
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14

      # App Store 제출용 6.9인치 스크린샷(docs/STORE.md §9). 데모 기록을 넣은 상태로 찍는다.
      - name: 스토어 스크린샷 (6.9인치)
        working-directory: SugarCap
        run: |
          BIG=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in sorted(devices.items()):
              if "iOS" not in runtime:
                  continue
              for device in items:
                  if not device.get("isAvailable"):
                      continue
                  name = device["name"]
                  rank = 2 if "Pro Max" in name else (1 if "Max" in name or "Plus" in name else 0)
                  if best is None or rank > best[0]:
                      best = (rank, device["udid"], name)
          if best is None:
              sys.exit(1)
          print(best[1], best[2], sep="\t")')
          UDID=${BIG%%$'\t'*}
          echo "기기: ${BIG#*$'\t'}"

          APP=build/Build/Products/Debug-iphonesimulator/SugarCap.app
          OUT="$RUNNER_TEMP/store-screenshots"
          mkdir -p "$OUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$APP"
          # 상태 바를 스토어 관례대로 고정한다(9:41, 통신·배터리 가득).
          xcrun simctl status_bar "$UDID" override --time "9:41" --cellularBars 4 --batteryState charged --batteryLevel 100

          store_shot() {
            local name="$1"; shift
            xcrun simctl launch "$UDID" com.sugarcap.app -seedDemo YES -onboardingCompleted YES "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/$name.png"
            xcrun simctl terminate "$UDID" com.sugarcap.app
          }

          store_shot 01-today
          store_shot 02-trends -initialTab trends -mockProOwned YES
          store_shot 03-feeding -screenshotFeeding YES
          store_shot 04-affinity -mockProOwned YES -screenshotAffinity YES
          store_shot 05-paywall -mockPro YES -screenshotPaywall YES
          # 업로드 전에 크기를 찍어 둔다. App Store 6.9인치는 1320x2868이어야 한다.
          for shot in "$OUT"/*.png; do
            sips -g pixelWidth -g pixelHeight "$shot" | xargs echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/store-screenshots
          retention-days: 30

  # TestFlight 업로드. Actions 탭에서 수동 실행한다.
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: SugarCap
        run: xcodegen generate

      # App Store Connect API 키. xcodebuild가 -authenticationKeyPath로 읽는다.
      - name: API 키 배치
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          # base64가 아니라 .p8 원문을 그대로 시크릿에 넣으면 디코드 결과가 쓰레기가 된다.
          # 비어 있지 않은지만 보면 그걸 못 잡으므로 헤더까지 확인한다.
          if ! head -n 1 "$KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "ASC_KEY_P8을 디코드했지만 PKCS#8 헤더가 없습니다." >&2
            echo "AuthKey_*.p8를 base64로 인코딩한 값을 넣었는지 확인하세요 (docs/RELEASE.md)." >&2
            exit 1
          fi

      - name: teamID 주입
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string ${TEAM_ID}" SugarCap/ExportOptions.plist

      # 아카이브는 서명 없이 만든다. 자동 서명은 archive에서 개발용 프로필을 요구하는데
      # 팀에 등록 기기가 없어 발급이 안 된다("Your team has no devices"). 배포 서명은 export가 cloud signing으로 한다.
      - name: 아카이브 (서명 없음)
        working-directory: SugarCap
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project SugarCap.xcodeproj \
            -scheme SugarCap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SugarCap.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 익스포트 + TestFlight 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SugarCap.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist SugarCap/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API 키 삭제
        if: always()
        run: rm -rf "$HOME/private_keys"
