name: iOS

# 리포는 public이라 macOS 러너가 무료다(2026-09-24 전환, 그전엔 private이라 분당 10배 과금).
# 푸시에는 서명 없는 컴파일 검증만 돌리고, TestFlight 업로드(시크릿 사용)는 수동 실행으로만 연다.
on:
  push:
    branches: [main]
    # 앱이 data/catalog.json을 그대로 번들한다. 카탈로그만 바뀐 푸시도 앱 테스트를 돌린다(2026-10-01).
    paths:
      - "SugarCap/**"
      - "data/catalog.json"
      - ".github/workflows/testflight.yml"
  pull_request:
    paths:
      - "SugarCap/**"
      - "data/catalog.json"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 컴파일 + 테스트. 서명·시크릿 없이 돈다.
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-26
    # 스크린샷(먹이기 단계·전환·소개·릴 프레임)이 늘어 25~30분 걸린다. 30분에서 잘려 취소된 적이 있다(2026-09-28).
    # 45분도 넘겨 끝 단계에서 취소됐다(2026-10-07, 영어 스크린샷 추가 전 46분).
    # 60분도 대만 스크린샷을 더하자 스토어 단계에서 잘렸다(2026-10-08, 63분).
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: SugarCap
        run: xcodegen generate

      # 시뮬레이터 이름은 Xcode 버전마다 바뀐다. 이름을 박지 않고 있는 것 중에서 고른다.
      - name: 시뮬레이터 선택
        run: |
          UDID=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          for runtime, devices in sorted(json.load(sys.stdin)["devices"].items()):
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device["name"]:
                      print(device["udid"], device["name"], sep="\t")
                      sys.exit(0)
          sys.exit(1)')
          echo "SIM_UDID=${UDID%%$'\t'*}" >> "$GITHUB_ENV"
          echo "선택: ${UDID#*$'\t'}"

      # 시뮬레이터에서도 ad-hoc 서명("-")을 해야 entitlements가 앱에 박힌다.
      # 서명을 끄면 App Group 컨테이너를 못 찾아 SwiftData가 그대로 죽는다(§4.6).
      # 기록 루프 UI 테스트를 화면째 녹화한다(SPEC §8 Phase 1 게이트 "플로우 녹화").
      # 녹화는 부팅된 기기에만 붙으므로 xcodebuild보다 먼저 부팅하고, 테스트가 실패해도 영상은 닫는다.
      - name: 테스트 (서명 없음) + 플로우 녹화
        working-directory: SugarCap
        run: |
          mkdir -p "$RUNNER_TEMP/flow"
          xcrun simctl boot "$SIM_UDID"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl io "$SIM_UDID" recordVideo --codec=h264 --force "$RUNNER_TEMP/flow/record-flow.mp4" &
          REC=$!
          sleep 2

          set +e
          xcodebuild test \
            -project SugarCap.xcodeproj \
            -scheme SugarCap \
            -configuration Debug \
            -destination "id=$SIM_UDID" \
            -derivedDataPath build \
            -resultBundlePath "$RUNNER_TEMP/Tests.xcresult" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO
          STATUS=$?
          set -e

          # SIGINT여야 recordVideo가 mp4 헤더를 마저 쓰고 끝난다.
          kill -INT "$REC"
          wait "$REC" || true
          ls -la "$RUNNER_TEMP/flow"
          exit "$STATUS"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flow-video
          path: ${{ runner.temp }}/flow
          retention-days: 14

      # UI 테스트가 실패하면 그 순간의 스크린샷이 xcresult에 들어 있다.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: ${{ runner.temp }}/Tests.xcresult
          retention-days: 7

      # 개발 환경에 Mac이 없어서 화면을 볼 수 있는 경로가 이것뿐이다(SPEC §8 Phase 1 게이트).
      # 테스트가 만든 .app을 그대로 설치해 찍는다. 재설치는 데이터를 지우지 않으므로
      # UI 테스트가 남긴 기록 2건(브랜드 메뉴 1 + 직접 입력 1)이 든 상태로 찍힌다.
      - name: 스크린샷
        working-directory: SugarCap
        run: |
          APP=build/Build/Products/Debug-iphonesimulator/SugarCap.app
          OUT="$RUNNER_TEMP/screenshots"
          mkdir -p "$OUT"
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcrun simctl install "$SIM_UDID" "$APP"
          # 설치 직후 첫 실행은 콜드 런치라 아래 sleep 안에 화면이 안 뜰 때가 있다(run 35956560232에서
          # light.png가 빈 흰 화면). 한 번 띄웠다 내려 두 번째부터 찍는다. 데이터는 건드리지 않는다.
          xcrun simctl launch "$SIM_UDID" com.sugarcap.app
          sleep 8
          xcrun simctl terminate "$SIM_UDID" com.sugarcap.app

          # 시뮬레이터 기본 언어가 영어라 한국어를 인자로 고정한다. 영어 화면은 shoot_en으로 따로 찍는다.
          # 네 번째 인자부터는 앱 실행 인자다. `-key value`는 UserDefaults 인자 도메인으로 들어가
          # 저장 없이 그 실행에만 적용된다(`-initialTab settings`, `-onboardingCompleted NO`).
          shoot() {
            local name="$1" appearance="$2" size="$3"
            shift 3
            xcrun simctl ui "$SIM_UDID" appearance "$appearance"
            xcrun simctl ui "$SIM_UDID" content_size "$size"
            xcrun simctl launch "$SIM_UDID" com.sugarcap.app -AppleLanguages "(ko)" -AppleLocale ko_KR "$@"
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/$name.png"
            xcrun simctl terminate "$SIM_UDID" com.sugarcap.app
          }

          shoot light light large
          # 표준 최대치(XXXL)를 넘는 접근성 크기로 레이아웃이 무너지는지 본다.
          shoot type-ax-xl light accessibility-extra-large
          # 첫 기록 전 안내("컵을 눌러 마신 음료 적기"). 시뮬레이터에 테스트 기록이 남아 있어 인자로 띄운다.
          shoot cup-hint light large -screenshotCupHint YES
          shoot cup-hint-type-ax-xl light accessibility-extra-large -screenshotCupHint YES
          shoot settings light large -initialTab settings
          # 온보딩 릴(한 시각에 멈춰) + 하루 기준 두 단계(2 = 당, 3 = 카페인).
          for at in 0.9 2.0 3.9 6.4 8.1 9.8 12.2 14.4; do
            shoot "onboarding-reel-$at" light large -onboardingCompleted NO -onboardingReelAt "$at"
          done
          shoot onboarding-2 light large -onboardingCompleted NO -onboardingPage 2
          shoot onboarding-3 light large -onboardingCompleted NO -onboardingPage 3
          shoot settings-type-ax-xl light accessibility-extra-large -initialTab settings
          shoot onboarding-2-type-ax-xl light accessibility-extra-large -onboardingCompleted NO -onboardingPage 2
          shoot onboarding-3-type-ax-xl light accessibility-extra-large -onboardingCompleted NO -onboardingPage 3
          # 마감 버튼은 저녁 이후에만 보여 러너 시각에 따라 닿지 못한다. Debug 빌드 전용 인자로 띄운다.
          shoot trends light large -initialTab trends
          shoot trends-type-ax-xl light accessibility-extra-large -initialTab trends
          shoot trends-caffeine light large -seedDemo YES -initialTab trends -trendSide caffeine
          shoot trends-month light large -seedDemo YES -mockProOwned YES -initialTab trends -trendRange month
          # 가끔 나오는 등장: 로슈 늦게 걸어오기(걷는 중·멈춘 순간), 카인 끝줄 선에 거꾸로 매달리기.
          shoot trends-walk-1.7 light large -seedDemo YES -initialTab trends -trendEntrance walk -trendEntranceAt 1.7
          shoot trends-walk-2.6 light large -seedDemo YES -initialTab trends -trendEntrance walk -trendEntranceAt 2.6
          shoot trends-hang light large -seedDemo YES -initialTab trends -trendSide caffeine -trendEntrance hang -trendEntranceAt 0
          # 하루 기준 화면(추이에서 push). 줄이는 중 화면은 맨 끝에서 찍는다.
          shoot limit-sugar light large -initialTab trends -trendLimit sugar
          shoot limit-sugar-type-ax-xl light accessibility-extra-large -initialTab trends -trendLimit sugar
          # 카페인 400 칩의 근거 기관이 메뉴 국가를 따른다(SPEC §9.9). 한국 = 식약처, en_US = FDA.
          shoot limit-caffeine light large -initialTab trends -trendLimit caffeine
          shoot feeding light large -screenshotFeeding YES
          shoot paywall light large -mockPro YES -screenshotPaywall YES
          shoot paywall-type-ax-xl light accessibility-extra-large -mockPro YES -screenshotPaywall YES
          shoot record light large -seedDemo YES -screenshotRecord YES
          shoot record-type-ax-xl light accessibility-extra-large -seedDemo YES -screenshotRecord YES
          shoot daylog light large -seedDemo YES -screenshotDayLog YES
          shoot daylog-type-ax-xl light accessibility-extra-large -seedDemo YES -screenshotDayLog YES
          shoot brand light large -seedDemo YES -screenshotBrand starbucks
          # 편의점은 검색 우선 화면(2026-10-01): 검색 전 안내, 띄어쓰기 섞은 검색 결과, 결과가 넘칠 때 안내.
          shoot brand-cvs light large -seedDemo YES -screenshotBrand cvs
          shoot brand-cvs-query light large -seedDemo YES -screenshotBrand cvs -screenshotBrandQuery "바나나 맛우유"
          shoot brand-cvs-many light large -seedDemo YES -screenshotBrand cvs -screenshotBrandQuery "커피"
          shoot brand-cvs-type-ax-xl light accessibility-extra-large -seedDemo YES -screenshotBrand cvs -screenshotBrandQuery "바나나"
          # 메뉴 썸네일(색 액체 원, SPEC §9.7): 카페 목록, 편의점 결과, 메뉴 패널의 큰 원, 기록 시트 검색.
          shoot brand-mega light large -seedDemo YES -screenshotBrand mega
          shoot brand-cvs-juice light large -seedDemo YES -screenshotBrand cvs -screenshotBrandQuery "주스"
          shoot brand-panel light large -seedDemo YES -screenshotBrand starbucks -screenshotBrandQuery "딸기" -screenshotBrandPanel YES
          # 카페인 컵에서 연 기록은 딸기 음료도 카페인이 크다(빌드 105 베타 피드백).
          shoot brand-caffeine light large -seedDemo YES -screenshotSide caffeine -screenshotBrand starbucks -screenshotBrandQuery "딸기"
          shoot brand-panel-caffeine light large -seedDemo YES -screenshotSide caffeine -screenshotBrand starbucks -screenshotBrandQuery "딸기" -screenshotBrandPanel YES
          shoot record-caffeine light large -seedDemo YES -screenshotSide caffeine -screenshotRecord YES
          # 설정 "기록할 것"에서 한 면만 켠 화면(2026-10-06). 저장하지 않는 인자라 다른 샷에 안 남는다.
          shoot tracks-settings light large -initialTab settings -screenshotTracks sugar
          shoot tracks-today-sugar light large -seedDemo YES -screenshotTracks sugar -screenshotSide caffeine
          shoot tracks-today-caffeine light large -seedDemo YES -screenshotTracks caffeine
          shoot tracks-panel-sugar light large -seedDemo YES -screenshotTracks sugar -screenshotBrand starbucks -screenshotBrandQuery "라떼" -screenshotBrandPanel YES
          shoot tracks-record-caffeine light large -seedDemo YES -screenshotTracks caffeine -screenshotRecord YES
          shoot tracks-daylog-caffeine light large -seedDemo YES -screenshotTracks caffeine -screenshotDayLog YES
          shoot brand-type-ax-xl light accessibility-extra-large -seedDemo YES -screenshotBrand starbucks
          shoot gate-feed light large -seedDemo YES -screenshotGate feed
          shoot gate-ask light large -screenshotGate ask
          shoot gate-feed-type-ax-xl light accessibility-extra-large -seedDemo YES -screenshotGate feed
          shoot feeding-type-ax-xl light accessibility-extra-large -screenshotFeeding YES
          # 먹이기 단계·전환 모션·로슈카인 소개(Debug 인자로 한 시각에 멈춰 찍는다).
          shoot feeding-dropped light large -screenshotFeeding YES -screenshotFeedingStage dropped
          shoot feeding-eaten light large -screenshotFeeding YES -screenshotFeedingStage eaten
          shoot feeding-caffeine light large -screenshotFeeding YES -screenshotFeedingStage caffeine
          shoot feeding-summary light large -screenshotFeeding YES -screenshotFeedingStage summary
          shoot feeding-summary-type-ax-xl light accessibility-extra-large -screenshotFeeding YES -screenshotFeedingStage summary
          # 먹일 게 없는 날(빈 컵 털기): 조르기, 톡톡, 작은 방울, 카인 조르기(짧게 끊은 설명 글이 카인과 안 겹치는지).
          shoot feeding-empty light large -screenshotFeeding YES -screenshotFeedingEmpty YES
          shoot feeding-empty-patting light large -screenshotFeeding YES -screenshotFeedingEmpty YES -screenshotFeedingStage patting
          shoot feeding-empty-dropped light large -screenshotFeeding YES -screenshotFeedingEmpty YES -screenshotFeedingStage dropped
          shoot feeding-empty-caffeine light large -screenshotFeeding YES -screenshotFeedingEmpty YES -screenshotFeedingStage caffeine
          shoot fx-dusk light large -screenshotFeeding YES -screenshotFx dusk -screenshotFxAt 0.8
          shoot fx-turn light large -screenshotFeeding YES -screenshotFeedingStage eaten -screenshotFx turn -screenshotFxAt 0.7
          shoot fx-night light large -screenshotFeeding YES -screenshotFeedingStage caffeine -screenshotFx night -screenshotFxAt 1.3
          # 한 면만 기록(2026-10-06 Phase 2): 카페인만이면 카인 한 번만 먹이고 마무리, 당만이면 어젯밤 화면에 로슈만.
          shoot tracks-feeding-caffeine light large -screenshotTracks caffeine -screenshotFeeding YES
          shoot tracks-feeding-eaten light large -screenshotTracks caffeine -screenshotFeeding YES -screenshotFeedingStage eaten
          shoot tracks-fx-night light large -screenshotTracks caffeine -screenshotFeeding YES -screenshotFeedingStage eaten -screenshotFx night -screenshotFxAt 1.3
          shoot tracks-feeding-summary light large -screenshotTracks caffeine -screenshotFeeding YES -screenshotFeedingStage summary
          shoot tracks-gate-feed light large -seedDemo YES -screenshotTracks sugar -screenshotGate feed
          shoot tracks-onlooker-kain light large -seedDemo YES -screenshotTracks sugar -screenshotOnlooker YES -idleAt 1.0
          shoot tracks-onlooker-kain-hug light large -seedDemo YES -screenshotTracks sugar -screenshotOnlooker YES -idlePose hug-strawberry -idleAt 2.0
          shoot tracks-onlooker-kain-empty light large -screenshotTracks sugar -screenshotOnlooker YES -idleStep 0 -idleAt 1.0
          shoot tracks-onlooker-roshu light large -seedDemo YES -screenshotTracks caffeine -screenshotOnlooker YES -idleAt 1.0
          shoot tracks-onlooker-roshu-floor light large -seedDemo YES -screenshotTracks caffeine -screenshotOnlooker YES -idlePose floor-sit -idleAt 3.0
          shoot tracks-onlooker-roshu-empty light large -screenshotTracks caffeine -screenshotOnlooker YES -idleStep 0 -idleAt 1.0
          shoot tracks-trends-sugar light large -seedDemo YES -screenshotTracks sugar -initialTab trends -trendSide caffeine -trendEntrance hang -trendEntranceAt 0
          shoot tracks-trends-caffeine light large -seedDemo YES -screenshotTracks caffeine -initialTab trends -trendEntrance hang -trendEntranceAt 0
          for at in 1.5 4.8 7.4 8.8 12.4 13.6; do
            shoot "intro-$at" light large -screenshotFeeding YES -screenshotIntroAt "$at"
          done
          # 대기 자세(design/proto/characters.html과 대조). 자세·단계·시각을 고정해 찍는다.
          shoot idle-roshu-in-cup light large -idlePose in-cup -idleStep 50 -idleAt 2.5
          shoot idle-roshu-watch light large -idlePose watch -idleStep 100 -idleAt 2.5
          shoot idle-roshu-walk light large -idlePose walk -idleStep 100 -idleAt 3.2
          shoot idle-roshu-slump light large -idlePose slump -idleStep 0 -idleAt 2.5
          shoot idle-roshu-hug-strawberry light large -idlePose hug-strawberry -idleStep 100 -idleAt 0.65
          shoot idle-roshu-wave light large -idlePose wave -idleStep 100 -idleAt 0.3
          shoot idle-roshu-doze-lean light large -idlePose doze-lean -idleStep 100 -idleAt 2.7
          shoot idle-kain-rim-stand light large -screenshotSide caffeine -idlePose rim-stand -idleStep 100 -idleAt 2.5
          shoot idle-kain-doze-one-leg light large -screenshotSide caffeine -idlePose doze-one-leg -idleStep 100 -idleAt 3.0
          shoot idle-kain-rim-sit light large -screenshotSide caffeine -idlePose rim-sit -idleStep 100 -idleAt 2.5
          shoot idle-kain-swim light large -screenshotSide caffeine -idlePose swim -idleStep 100 -idleAt 3.7
          shoot idle-kain-swim-spin light large -screenshotSide caffeine -idlePose swim -idleStep 50 -idleAt 5.75
          shoot idle-kain-walk light large -screenshotSide caffeine -idlePose walk -idleStep 100 -idleAt 3.2
          shoot idle-kain-floor-sit light large -screenshotSide caffeine -idlePose floor-sit -idleStep 0 -idleAt 2.5
          # 선물(SPEC §4.9): 로슈가 상자를 들고 걸어 들어와 서고, 누르면 카드.
          shoot gift-walk light large -screenshotGift trends -giftAt 1.4
          shoot gift-wait light large -screenshotGift trends -giftAt 3
          shoot gift-card light large -screenshotGift trends -giftAt 3 -screenshotGiftCard YES
          shoot gift-card-type-ax-xl light accessibility-extra-large -screenshotGift trends -giftAt 3 -screenshotGiftCard YES
          # 영어판(SPEC §9.9 Phase 1b). 긴 영어 문장이 넘치는지 큰 글자에서도 본다.
          # 미국 사용자 화면이라 메뉴 국가를 미국으로 고정한다. UI 테스트가 저장한 나라(한국)가 남아 있어서 지역만으로는 안 바뀐다.
          shoot_en() {
            local name="$1" size="$2"
            shift 2
            xcrun simctl ui "$SIM_UDID" content_size "$size"
            xcrun simctl launch "$SIM_UDID" com.sugarcap.app -AppleLanguages "(en)" -AppleLocale en_US -screenshotMenuCountry us "$@"
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/en-$name.png"
            xcrun simctl terminate "$SIM_UDID" com.sugarcap.app
          }
          shoot_en light large
          shoot_en type-ax-xl accessibility-extra-large
          shoot_en cup-hint large -screenshotCupHint YES
          shoot_en settings large -initialTab settings
          shoot_en settings-type-ax-xl accessibility-extra-large -initialTab settings
          for at in 0.9 2.0 3.9 6.4 8.1 9.8 12.2 14.4; do
            shoot_en "onboarding-reel-$at" large -onboardingCompleted NO -onboardingReelAt "$at"
          done
          shoot_en onboarding-2 large -onboardingCompleted NO -onboardingPage 2
          shoot_en onboarding-3 large -onboardingCompleted NO -onboardingPage 3
          shoot_en onboarding-3-type-ax-xl accessibility-extra-large -onboardingCompleted NO -onboardingPage 3
          shoot_en trends large -seedDemo YES -initialTab trends
          shoot_en trends-month large -seedDemo YES -mockProOwned YES -initialTab trends -trendRange month
          shoot_en limit-sugar large -initialTab trends -trendLimit sugar
          shoot_en limit-caffeine large -initialTab trends -trendLimit caffeine
          shoot_en paywall large -mockPro YES -screenshotPaywall YES
          shoot_en paywall-type-ax-xl accessibility-extra-large -mockPro YES -screenshotPaywall YES
          shoot_en record large -seedDemo YES -screenshotRecord YES
          shoot_en daylog large -seedDemo YES -screenshotDayLog YES
          shoot_en brand-panel large -seedDemo YES -screenshotBrand us-starbucks -screenshotBrandQuery "Strawberry" -screenshotBrandPanel YES
          shoot_en brand-many large -seedDemo YES -screenshotBrand us-dutchbros -screenshotBrandQuery "Mocha"
          shoot_en gate-feed large -seedDemo YES -screenshotGate feed
          shoot_en gate-ask large -screenshotGate ask
          shoot_en feeding large -screenshotFeeding YES
          shoot_en feeding-type-ax-xl accessibility-extra-large -screenshotFeeding YES
          shoot_en feeding-dropped large -screenshotFeeding YES -screenshotFeedingStage dropped
          shoot_en feeding-eaten large -screenshotFeeding YES -screenshotFeedingStage eaten
          shoot_en feeding-summary large -screenshotFeeding YES -screenshotFeedingStage summary
          shoot_en feeding-empty-patting large -screenshotFeeding YES -screenshotFeedingEmpty YES -screenshotFeedingStage patting
          shoot_en fx-dusk large -screenshotFeeding YES -screenshotFx dusk -screenshotFxAt 0.8
          for at in 1.5 4.8 7.4 8.8 12.4 13.6; do
            shoot_en "intro-$at" large -screenshotFeeding YES -screenshotIntroAt "$at"
          done
          # 대만판(SPEC §9.9 ④). 번체 문장 넘침과 대만 메뉴(카페인 구간 표기)를 본다.
          shoot_zh() {
            local name="$1" size="$2"
            shift 2
            xcrun simctl ui "$SIM_UDID" content_size "$size"
            xcrun simctl launch "$SIM_UDID" com.sugarcap.app -AppleLanguages "(zh-Hant)" -AppleLocale zh_TW -screenshotMenuCountry tw "$@"
            sleep 4
            xcrun simctl io "$SIM_UDID" screenshot "$OUT/zh-$name.png"
            xcrun simctl terminate "$SIM_UDID" com.sugarcap.app
          }
          shoot_zh light large
          shoot_zh type-ax-xl accessibility-extra-large
          shoot_zh settings large -initialTab settings
          shoot_zh settings-type-ax-xl accessibility-extra-large -initialTab settings
          shoot_zh onboarding-2 large -onboardingCompleted NO -onboardingPage 2
          shoot_zh onboarding-3 large -onboardingCompleted NO -onboardingPage 3
          shoot_zh trends large -seedDemo YES -initialTab trends
          shoot_zh limit-sugar large -initialTab trends -trendLimit sugar
          shoot_zh limit-caffeine large -initialTab trends -trendLimit caffeine
          shoot_zh paywall large -mockPro YES -screenshotPaywall YES
          shoot_zh paywall-type-ax-xl accessibility-extra-large -mockPro YES -screenshotPaywall YES
          shoot_zh record large -seedDemo YES -screenshotRecord YES
          shoot_zh daylog large -seedDemo YES -screenshotDayLog YES
          shoot_zh brand-panel large -seedDemo YES -screenshotBrand tw-cama -screenshotBrandQuery "拿鐵" -screenshotBrandPanel YES
          shoot_zh brand-panel-caffeine large -seedDemo YES -screenshotSide caffeine -screenshotBrand tw-kebuke -screenshotBrandQuery "熟成紅茶" -screenshotBrandPanel YES
          shoot_zh brand-many large -seedDemo YES -screenshotBrand tw-kebuke -screenshotBrandQuery "奶茶"
          shoot_zh gate-feed large -seedDemo YES -screenshotGate feed
          shoot_zh feeding large -screenshotFeeding YES
          shoot_zh feeding-summary large -screenshotFeeding YES -screenshotFeedingStage summary
          shoot_zh feeding-summary-type-ax-xl accessibility-extra-large -screenshotFeeding YES -screenshotFeedingStage summary
          xcrun simctl ui "$SIM_UDID" content_size large
          # 감소 목표는 저장돼 남는다. 맨 끝에 찍고 앱을 지워 스토어 스크린샷(같은 기기일 수 있음)에 넘기지 않는다.
          shoot limit-caffeine-reducing light large -mockProOwned YES -seedGoal caffeine -initialTab trends -trendLimit caffeine
          xcrun simctl uninstall "$SIM_UDID" com.sugarcap.app
          ls -la "$OUT"

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 14

      # 컴파일러가 뽑은 현지화 키 목록(SPEC §9.9). 개발 환경에 Xcode가 없어 String Catalog 키를 여기서 받는다.
      - name: 현지화 문구 내보내기
        working-directory: SugarCap
        run: |
          xcodebuild -exportLocalizations \
            -project SugarCap.xcodeproj \
            -localizationPath "$RUNNER_TEMP/localizations" \
            -exportLanguage ko \
            -sdk iphonesimulator
          ls -laR "$RUNNER_TEMP/localizations"

      - uses: actions/upload-artifact@v4
        with:
          name: localizations
          path: ${{ runner.temp }}/localizations
          retention-days: 14

      # App Store 제출용 6.9인치 스크린샷(docs/STORE.md §9). 데모 기록을 넣은 상태로 찍는다.
      - name: 스토어 스크린샷 (6.9인치)
        working-directory: SugarCap
        run: |
          BIG=$(xcrun simctl list devices available -j | /usr/bin/python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          best = None
          for runtime, items in sorted(devices.items()):
              if "iOS" not in runtime:
                  continue
              for device in items:
                  if not device.get("isAvailable"):
                      continue
                  name = device["name"]
                  rank = 2 if "Pro Max" in name else (1 if "Max" in name or "Plus" in name else 0)
                  if best is None or rank > best[0]:
                      best = (rank, device["udid"], name)
          if best is None:
              sys.exit(1)
          print(best[1], best[2], sep="\t")')
          UDID=${BIG%%$'\t'*}
          echo "기기: ${BIG#*$'\t'}"

          APP=build/Build/Products/Debug-iphonesimulator/SugarCap.app
          OUT="$RUNNER_TEMP/store-screenshots"
          mkdir -p "$OUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$APP"
          # 위 스크린샷 단계와 같은 이유로 콜드 런치를 한 번 소모한다.
          xcrun simctl launch "$UDID" com.sugarcap.app -onboardingCompleted YES
          sleep 8
          xcrun simctl terminate "$UDID" com.sugarcap.app
          # 상태 바를 스토어 관례대로 고정한다(9:41, 통신·배터리 가득).
          xcrun simctl status_bar "$UDID" override --time "9:41" --cellularBars 4 --batteryState charged --batteryLevel 100

          store_shot() {
            local name="$1"; shift
            xcrun simctl launch "$UDID" com.sugarcap.app -AppleLanguages "(ko)" -AppleLocale ko_KR -seedDemo YES -onboardingCompleted YES "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/$name.png"
            xcrun simctl terminate "$UDID" com.sugarcap.app
          }

          store_shot 01-today
          store_shot 02-trends -initialTab trends -mockProOwned YES
          store_shot 03-feeding -screenshotFeeding YES
          store_shot 04-paywall -mockPro YES -screenshotPaywall YES

          # 미국 스토어(영어, SPEC §9.9 ③). 데모 기록은 빈 앱에만 들어가니 지우고 다시 깔아 미국 메뉴로 채운다.
          xcrun simctl uninstall "$UDID" com.sugarcap.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.sugarcap.app -onboardingCompleted YES
          sleep 8
          xcrun simctl terminate "$UDID" com.sugarcap.app
          mkdir -p "$OUT/en-US"
          store_shot_en() {
            local name="$1"; shift
            xcrun simctl launch "$UDID" com.sugarcap.app -AppleLanguages "(en)" -AppleLocale en_US -screenshotMenuCountry us -seedDemo YES -onboardingCompleted YES "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/en-US/$name.png"
            xcrun simctl terminate "$UDID" com.sugarcap.app
          }
          store_shot_en 01-today
          store_shot_en 02-trends -initialTab trends -mockProOwned YES
          store_shot_en 03-feeding -screenshotFeeding YES
          store_shot_en 04-paywall -mockPro YES -screenshotPaywall YES

          # 대만 스토어(번체, SPEC §9.9 ④). 미국과 같은 이유로 다시 깔아 대만 메뉴로 채운다.
          xcrun simctl uninstall "$UDID" com.sugarcap.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.sugarcap.app -onboardingCompleted YES
          sleep 8
          xcrun simctl terminate "$UDID" com.sugarcap.app
          mkdir -p "$OUT/zh-Hant"
          store_shot_zh() {
            local name="$1"; shift
            xcrun simctl launch "$UDID" com.sugarcap.app -AppleLanguages "(zh-Hant)" -AppleLocale zh_TW -screenshotMenuCountry tw -seedDemo YES -onboardingCompleted YES "$@"
            sleep 5
            xcrun simctl io "$UDID" screenshot "$OUT/zh-Hant/$name.png"
            xcrun simctl terminate "$UDID" com.sugarcap.app
          }
          store_shot_zh 01-today
          store_shot_zh 02-trends -initialTab trends -mockProOwned YES
          store_shot_zh 03-feeding -screenshotFeeding YES
          store_shot_zh 04-paywall -mockPro YES -screenshotPaywall YES

          # 업로드 전에 크기를 찍어 둔다. App Store 6.9인치는 1320x2868이어야 한다.
          for shot in "$OUT"/*.png "$OUT"/en-US/*.png "$OUT"/zh-Hant/*.png; do
            sips -g pixelWidth -g pixelHeight "$shot" | xargs echo
          done

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/store-screenshots
          retention-days: 30

  # TestFlight 업로드. Actions 탭에서 수동 실행한다.
  testflight:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 버전
        run: xcodebuild -version

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: 프로젝트 생성
        working-directory: SugarCap
        run: xcodegen generate

      # App Store Connect API 키. xcodebuild가 -authenticationKeyPath로 읽는다.
      - name: API 키 배치
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          KEY="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY"
          # base64가 아니라 .p8 원문을 그대로 시크릿에 넣으면 디코드 결과가 쓰레기가 된다.
          # 비어 있지 않은지만 보면 그걸 못 잡으므로 헤더까지 확인한다.
          if ! head -n 1 "$KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "ASC_KEY_P8을 디코드했지만 PKCS#8 헤더가 없습니다." >&2
            echo "AuthKey_*.p8를 base64로 인코딩한 값을 넣었는지 확인하세요 (docs/RELEASE.md)." >&2
            exit 1
          fi

      - name: teamID 주입
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Add :teamID string ${TEAM_ID}" SugarCap/ExportOptions.plist

      # 아카이브는 서명 없이 만든다. 자동 서명은 archive에서 개발용 프로필을 요구하는데
      # 팀에 등록 기기가 없어 발급이 안 된다("Your team has no devices"). 배포 서명은 export가 cloud signing으로 한다.
      - name: 아카이브 (서명 없음)
        working-directory: SugarCap
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          xcodebuild archive \
            -project SugarCap.xcodeproj \
            -scheme SugarCap \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/SugarCap.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: 익스포트 + TestFlight 업로드
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/SugarCap.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist SugarCap/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: API 키 삭제
        if: always()
        run: rm -rf "$HOME/private_keys"
