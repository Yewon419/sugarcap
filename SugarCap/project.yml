name: SugarCap

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # 문구 원문이 한국어다. String Catalog(Resources/Localizable.xcstrings)의 sourceLanguage와 맞춘다(SPEC §9.9).
  developmentLanguage: ko

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.1"
    # CI가 xcodebuild 인자로 덮어쓴다 (docs/RELEASE.md)
    CURRENT_PROJECT_VERSION: "1"

targets:
  SugarCap:
    type: application
    platform: iOS
    dependencies:
      - target: SugarCapWidget
    entitlements:
      path: SugarCap.entitlements
    sources:
      - path: Sources
        # 위젯 코드는 확장 타깃 것이다. 앱까지 컴파일하면 @main이 둘이 된다.
        excludes:
          - "Widget/**"
      - path: Resources
      # 수집 파이프라인 산출물을 그대로 번들에 넣는다. 복사본을 두면 갱신이 갈라진다.
      - path: ../data/catalog.json
        buildPhase: resources
      - path: ../data/catalog-us.json
        buildPhase: resources
      - path: ../data/catalog-tw.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app
        PRODUCT_NAME: SugarCap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
    # sources 밖에 둔다. Resources/ 안에 두면 생성된 plist가
    # Copy Bundle Resources에도 걸려 "Multiple commands produce Info.plist"가 난다.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 슈가캡
        # 지정하지 않으면 XcodeGen이 1.0 / 1을 박아 넣는다. 빌드 설정을 따르게 한다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        # 라이트 모드 전용(SPEC §5).
        UIUserInterfaceStyle: Light
        # 번들 글꼴(AppFont). 파일은 Resources/Fonts, 경로 없이 파일 이름만 적는다.
        UIAppFonts:
          - Pretendard-Thin.otf
          - Pretendard-Regular.otf
          - Pretendard-Medium.otf
          - Pretendard-SemiBold.otf
          - Pretendard-Bold.otf
          - Pretendard-ExtraBold.otf
          - Pretendard-Black.otf
          - ArchivoBlack-Regular.ttf
          - Anton-Regular.ttf
          - SugarCapMasthead-Black.ttf
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 이용 기록 전송(SPEC §9.10). CI가 시크릿을 xcodebuild 인자로 넣는다. 없으면 빈 값이라 보내지 않는다.
        TelemetryDeckAppID: $(TELEMETRYDECK_APP_ID)

  SugarCapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # 테스트는 실제 카탈로그를 읽는다(목 없음). 테스트 번들에도 같은 파일이 필요하다.
      - path: ../data/catalog.json
        buildPhase: resources
      - path: ../data/catalog-us.json
        buildPhase: resources
      - path: ../data/catalog-tw.json
        buildPhase: resources
    dependencies:
      - target: SugarCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SugarCap.app/SugarCap
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests-Info.plist
      properties: {}

  # 기록 루프 end-to-end. 실제 앱을 띄워 탭으로만 진행한다.
  SugarCapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SugarCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app.uitests
        TEST_TARGET_NAME: SugarCap
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: UITests-Info.plist
      properties: {}

  # Small·Medium 위젯(SPEC §4.6). 앱과 App Group 저장소를 공유한다.
  SugarCapWidget:
    type: app-extension
    platform: iOS
    entitlements:
      path: SugarCapWidget.entitlements
    sources:
      - path: Sources/Widget
      # 위젯 그림. 앱도 Debug 위젯 스크린샷(`-screenshotWidget`)으로 같이 컴파일한다.
      - path: Sources/WidgetUI
      - path: Sources/Shared
      - path: Sources/Model
      - path: Sources/Day
      - path: Sources/Reduction/ReductionMath.swift
      - path: Sources/Settlement/SettlementMath.swift
      - path: Sources/Today/CupSide.swift
      - path: Sources/Today/Amount.swift
      - path: Sources/Today/CupLevel.swift
      # Large 위젯 선반의 음료 원(앱 메뉴 썸네일과 같은 그림).
      - path: Sources/Brand/LiquidBadge.swift
      # CupSide·Amount가 String(localized:)로 위젯 번들에서 문구를 찾는다.
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
      # 캐릭터 스프라이트만 든 카탈로그. 컵 장면(2048px 9장)은 위젯에 넣지 않는다.
      - path: Resources/Shared.xcassets
      # 위젯 칸 모양대로 미리 자른 잔 사진(`design/assets/cups/make_widget_crops.py`). 큰 사진은 위젯이 못 그린다.
      - path: Resources/Widget.xcassets
      - path: Resources/Fonts/Anton-Regular.ttf
      - path: Resources/Fonts/Pretendard-SemiBold.otf
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app.widget
        PRODUCT_NAME: SugarCapWidget
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
        SKIP_INSTALL: YES
    info:
      path: Widget-Info.plist
      properties:
        CFBundleDisplayName: 슈가캡
        # 앱과 같은 버전·빌드 번호를 받는다. 없으면 XcodeGen 기본값 "1"로 굳어
        # 업로드 때 "CFBundleVersion Mismatch" 경고가 난다(1.0 (52) 업로드에서 확인).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Anton-Regular.ttf
          - Pretendard-SemiBold.otf
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  SugarCap:
    build:
      targets:
        SugarCap: all
    run:
      config: Debug
    test:
      config: Debug
      # 시뮬레이터 기본 언어는 영어다. en 번역이 생긴 뒤에도 기존 테스트는 한국어 화면을 본다.
      language: ko
      region: KR
      targets:
        - name: SugarCapTests
        - name: SugarCapUITests
    archive:
      config: Release
    management:
      shared: true
