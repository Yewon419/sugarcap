name: SugarCap

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    # CI가 xcodebuild 인자로 덮어쓴다 (docs/RELEASE.md)
    CURRENT_PROJECT_VERSION: "1"

targets:
  SugarCap:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      # 수집 파이프라인 산출물을 그대로 번들에 넣는다. 복사본을 두면 갱신이 갈라진다.
      - path: ../data/catalog.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app
        PRODUCT_NAME: SugarCap
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_STRICT_CONCURRENCY: complete
    # sources 밖에 둔다. Resources/ 안에 두면 생성된 plist가
    # Copy Bundle Resources에도 걸려 "Multiple commands produce Info.plist"가 난다.
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: 슈가캡
        # 지정하지 않으면 XcodeGen이 1.0 / 1을 박아 넣는다. 빌드 설정을 따르게 한다.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: ko
        UILaunchScreen: {}
        # 라이트 모드 전용(SPEC §5).
        UIUserInterfaceStyle: Light
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false

  SugarCapTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
      # 테스트는 실제 카탈로그를 읽는다(목 없음). 테스트 번들에도 같은 파일이 필요하다.
      - path: ../data/catalog.json
        buildPhase: resources
    dependencies:
      - target: SugarCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SugarCap.app/SugarCap
        BUNDLE_LOADER: $(TEST_HOST)
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Tests-Info.plist
      properties: {}

  # 기록 루프 end-to-end. 실제 앱을 띄워 탭으로만 진행한다.
  SugarCapUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: SugarCap
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sugarcap.app.uitests
        TEST_TARGET_NAME: SugarCap
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: UITests-Info.plist
      properties: {}

schemes:
  SugarCap:
    build:
      targets:
        SugarCap: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: SugarCapTests
        - name: SugarCapUITests
    archive:
      config: Release
    management:
      shared: true
