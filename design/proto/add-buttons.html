<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>음료 추가 버튼 비교 (2026-10-05)</title>
<!-- 대표님: 오늘 화면 + 버튼과 먹이기 '음료 추가' 알약이 "구리다". 두 버튼을 같은 문법으로 고치는 안 비교.
     프로토 흐름은 건드리지 않는 비교 전용 페이지. 색은 앱 값(액센트 #18181B, 밤 #172239, 벽 #F4F4F5). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root { --accent: #18181b; --wall: #f4f4f5; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: Pretendard, -apple-system, sans-serif; background: #d9dbe0; padding: 32px; }
  h1 { font-size: 20px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 402px); gap: 28px; }
  .col h2 { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
  .col p { font-size: 13px; color: #555; margin: 0 0 12px; min-height: 36px; line-height: 1.4; }
  .frame { position: relative; width: 402px; height: 360px; overflow: hidden; border-radius: 0 0 48px 48px; background: var(--wall); margin-bottom: 20px; }
  .frame img.photo { position: absolute; left: 0; bottom: 0; width: 402px; }
  .night::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 30%, rgba(0,0,0,.45)); }
  .home { position: absolute; left: 50%; bottom: 8px; width: 140px; height: 5px; border-radius: 3px; background: #000; transform: translateX(-50%); z-index: 3; }
  .night .home { background: #fff; }

  /* 오늘 아래쪽: 마감(왼쪽) · 점(가운데) · 기록(오른쪽). 마감 알약은 이번 범위 밖이라 그대로. */
  .controls { position: absolute; left: 20px; right: 20px; bottom: 46px; height: 59px; display: flex; align-items: center; justify-content: space-between; z-index: 2; }
  .dots { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(0,0,0,.25); }
  .dots i.on { background: rgba(0,0,0,.85); }
  .glass-pill { display: inline-flex; align-items: center; gap: 7px; height: 39px; padding: 0 16px; border-radius: 20px; font: 600 15px Pretendard;
    background: rgba(245,245,247,.62); backdrop-filter: blur(20px) saturate(1.6); border: 1px solid rgba(255,255,255,.45); box-shadow: 0 3px 8px rgba(0,0,0,.1); color: #000; }

  /* 먹이기 아래쪽: 버튼 + 안내 한 줄(흰 60%). */
  .foot { position: absolute; left: 24px; right: 24px; bottom: 34px; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .foot small { font-size: 12px; color: rgba(255,255,255,.6); }
  .foot .slot { min-height: 56px; display: flex; align-items: center; }

  button { font-family: inherit; border: 0; cursor: pointer; }
  button:active { transform: scale(.97); }

  /* 기존 */
  .old-fab { width: 59px; height: 59px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; box-shadow: 0 6px 12px rgba(0,0,0,.18); }
  .old-pill { color: #fff; background: rgba(255,255,255,.18); }

  /* A 각진 버튼: 모서리 16(연속 곡률), 그림자·유리 없음. 오늘 = 검정 칸, 밤 = 흰 칸(뒤집기). */
  .a-today { width: 56px; height: 56px; border-radius: 16px; background: var(--accent); color: #fff; display: grid; place-items: center; }
  .a-night { height: 48px; padding: 0 20px; border-radius: 14px; background: #fff; color: var(--accent); display: inline-flex; align-items: center; gap: 8px; font: 700 15px Pretendard; }

  /* B 글자 버튼: 바탕 없음. 오늘 = 검정 글자, 밤 = 흰 글자. 누르는 칸은 44pt 이상. */
  .b-today { height: 48px; padding: 0 4px; background: none; color: var(--accent); display: inline-flex; align-items: center; gap: 6px; font: 700 17px Pretendard; letter-spacing: -0.01em; }
  .b-night { height: 44px; padding: 0 4px; background: none; color: #fff; display: inline-flex; align-items: center; gap: 6px; font: 700 15px Pretendard;
    text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 5px; }
</style>
</head>
<body>
<h1>음료 추가 버튼 비교 · 위: 오늘 화면 아래쪽 / 아래: 먹이기 밤 장면 첫 단계</h1>
<div class="grid" id="grid"></div>
<script>
const PHOTO = '../../SugarCap/Resources/Assets.xcassets/cup-strawberry-latte-100.imageset/100.png';
const plus = (size, w) => `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"/></svg>`;
const moon = '<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M13.2 4.2a8 8 0 1 0 7.1 11.6 6.6 6.6 0 0 1-7.1-11.6Z"/></svg>';

const VARIANTS = [
  { name: '기존', note: '지금 앱. 그림자 깔린 검정 동그라미(FAB), 밤에는 유리 알약.',
    today: `<button class="old-fab" aria-label="기록 추가">${plus(26, 1.8)}</button>`,
    night: `<button class="glass-pill old-pill">${plus(16, 2.2)} 음료 추가</button>` },
  { name: 'A 각진 버튼', note: '그림자·유리 없이 단색 둥근 사각형. 오늘은 검정 칸, 밤은 흰 칸으로 뒤집는다.',
    today: `<button class="a-today" aria-label="기록 추가">${plus(24, 2)}</button>`,
    night: `<button class="a-night">${plus(16, 2.4)} 음료 추가</button>` },
  { name: 'B 글자 버튼', note: '바탕 없이 글자와 + 만. 오늘은 검정 글자, 밤은 밑줄 흰 글자. 사진이 가장 덜 가려진다.',
    today: `<button class="b-today">${plus(18, 2.4)} 음료 추가</button>`,
    night: `<button class="b-night">${plus(15, 2.4)} 음료 추가</button>` },
];

document.getElementById('grid').innerHTML = VARIANTS.map(v => `
  <div class="col">
    <h2>${v.name}</h2><p>${v.note}</p>
    <div class="frame"><img class="photo" src="${PHOTO}" alt="">
      <div class="controls"><span class="glass-pill">${moon} 오늘 마감</span><span class="dots"><i class="on"></i><i></i></span>${v.today}</div>
      <span class="home"></span></div>
    <div class="frame night"><img class="photo" src="${PHOTO}" alt="">
      <div class="foot"><div class="slot">${v.night}</div><small>마감 뒤에 마신 음료도 오늘 몫으로 빠져요</small></div>
      <span class="home"></span></div>
  </div>`).join('');
</script>
</body>
</html>
