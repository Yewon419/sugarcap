<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>슈가캡 · 로슈·카인 대기 자세 실험</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --wall: #F3F5F8;
    --ink: #18181B;
    --grey: #71717A;
    --font: "SF Pro Display", -apple-system, "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @font-face { font-family: "Anton"; src: url("../../SugarCap/Resources/Fonts/Anton-Regular.ttf"); }
  @font-face { font-family: "PretendardApp"; font-weight: 400; src: url("../../SugarCap/Resources/Fonts/Pretendard-Regular.otf"); }
  @font-face { font-family: "PretendardApp"; font-weight: 600; src: url("../../SugarCap/Resources/Fonts/Pretendard-SemiBold.otf"); }
  @font-face { font-family: "PretendardApp"; font-weight: 800; src: url("../../SugarCap/Resources/Fonts/Pretendard-ExtraBold.otf"); }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E4E4E7; font-family: var(--font); color: var(--ink); display: flex; gap: 32px; padding: 32px; align-items: flex-start; }

  /* 393×852 = iPhone 15 Pro. CupView와 같은 비율로 사진을 놓는다. */
  .phone { position: relative; width: 393px; height: 852px; overflow: hidden; background: var(--wall); border-radius: 48px; flex: none; }
  .photo { position: absolute; left: 0; right: 0; bottom: calc(852px * 0.04); height: calc(852px * 0.84); overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 96%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 96%, transparent 100%); }
  .photo img { position: absolute; bottom: 0; left: 50%; height: 100%; transform: translateX(-50%); }

  .chars { position: absolute; inset: 0; pointer-events: none; }
  /* 유리에 비친 모습(WebGL). 컵 누끼로 잘라 유리 안에만 보인다. */
  .glass { position: absolute; left: 0; top: 0; width: 393px; height: 852px; pointer-events: none; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; }
  /* 그림자: 넓고 옅은 그늘 + 발밑 진한 접지. 가운데서 바깥으로 흐려진다. */
  .bubble { position: absolute; left: 0; top: 0; border-radius: 50%; background: #fff; display: none; }
  .shade { position: absolute; left: 0; top: 0; border-radius: 50%; will-change: transform, opacity; mix-blend-mode: multiply; }
  .shade.ambient { background: radial-gradient(closest-side, rgba(120, 104, 108, .55), rgba(120, 104, 108, .3) 45%, rgba(120, 104, 108, .1) 75%, rgba(120, 104, 108, 0)); filter: blur(3px); }
  .shade.contact { background: radial-gradient(closest-side, rgba(70, 56, 60, .8), rgba(70, 56, 60, .45) 40%, rgba(70, 56, 60, 0)); filter: blur(1px); }
  .sprite { position: absolute; left: 0; top: 0; will-change: transform; }
  .sprite .layer { position: absolute; inset: 0; }
  .sprite img { position: absolute; }
  .lid { position: absolute; border-radius: 50%; transform-origin: 50% 0; }

  /* UI는 캐릭터보다 위 층. */
  .ui { position: absolute; inset: 0; pointer-events: none; }
  /* 오늘 화면 틀(앱 CupHero·TodayView, 2026-10-24 CI 화면 기준). 큰 숫자는 잔 뒤(캐릭터 아래), 버튼·점은 캐릭터 위. */
  .status { position: absolute; top: 18px; left: 44px; font-size: 17px; font-weight: 600; }
  .icons { position: absolute; top: 67px; right: 16px; display: flex; }
  .icons i { position: relative; width: 44px; height: 36px; display: grid; place-items: center; }
  .icons i::before { content: ""; position: absolute; left: 4px; top: 0; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.22); }
  .icons svg { position: relative; width: 20px; height: 20px; color: rgba(24,24,27,.7); }
  .hero { position: absolute; inset: 0; pointer-events: none;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat; -webkit-mask-composite: xor; mask-composite: exclude; }
  .hero .fixed { position: absolute; font-family: "PretendardApp", var(--font); white-space: nowrap; }
  .hero svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .masthead { display: grid; }
  .masthead .wd { font-size: 12px; font-weight: 600; letter-spacing: 1.3px; line-height: 1.2; }
  .masthead .dt { font-size: 28px; font-weight: 800; letter-spacing: -0.4px; color: var(--ink); margin-top: 2px; line-height: 1.2; }
  .masthead .fact { font-size: 12.5px; color: rgba(24,24,27,.55); line-height: 1.45; white-space: normal; max-width: 260px; margin-top: 6px; }
  .masthead hr { width: 132px; height: 1px; border: 0; margin: 11px 0 0; background: rgba(24,24,27,.5); }
  .masthead.right { justify-items: end; text-align: right; }
  .hero .label { font-family: var(--font); font-size: 11px; font-weight: 600; letter-spacing: 1.3px; }
  .close { position: absolute; left: 20px; top: 759px; height: 34px; padding: 0 14px 0 12px; border-radius: 17px; background: rgba(255,255,255,.55);
    box-shadow: 0 0 0 .5px rgba(0,0,0,.06); display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; color: rgba(24,24,27,.75); }
  .dots { position: absolute; top: 803px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(24,24,27,.25); }
  .dots i.on { background: rgba(24,24,27,.85); }

  /* 조작 패널 */
  .panel { width: 300px; display: grid; gap: 20px; }
  .panel h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .panel h2 { font-size: 13px; margin: 0 0 8px; color: var(--grey); font-weight: 600; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .panel button { font: inherit; font-size: 14px; border: 1px solid #D4D4D8; background: #fff; color: var(--ink); border-radius: 8px; padding: 8px 12px; cursor: pointer; }
  .panel button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
  .panel button:disabled { opacity: .35; cursor: default; }
  .note { font-size: 13px; line-height: 1.6; color: #52525B; margin: 0; }
  .now { font-size: 14px; font-weight: 600; }
</style>
</head>
<body>
  <div class="phone" id="phone">
    <div class="photo"><img id="cup" alt=""></div>
    <div class="hero" id="hero"></div>
    <canvas class="glass" id="glass"></canvas>
    <div class="chars" id="chars"></div>
    <div class="ui">
      <div class="status">1:50</div>
      <div class="icons">
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.8l-5.2 2.8 1-5.8-4.3-4.1 5.9-.8z"/></svg></i>
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4.5" y="6" width="3.6" height="9" rx="1"/><rect x="10.2" y="6" width="3.6" height="9" rx="1"/><rect x="15.9" y="6" width="3.6" height="9" rx="1"/><path d="M3 18.5h18"/></svg></i>
        <i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M6 5h11M7.5 5l1.2 14h5.6L15.5 5M17 11.5h2"/><circle cx="19.5" cy="11.5" r="1.2" fill="currentColor"/></svg></i>
      </div>
      <div class="close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>마감함</div>
      <div class="dots"><i></i><i></i></div>
    </div>
  </div>

  <div class="panel">
    <h1 id="title">대기 자세</h1>
    <div><h2>캐릭터</h2><div class="row" id="chars-row"></div></div>
    <div><h2>남은 양(컵 단계)</h2><div class="row" id="steps"></div></div>
    <div><h2>자세</h2><div class="row" id="poses"></div></div>
    <div><h2>앱 열기 흉내</h2><div class="row"><button id="reroll">다시 열기(자동 뽑기)</button><button id="reduce" aria-pressed="false">동작 줄이기</button></div></div>
    <p class="now" id="now"></p>
    <p class="note" id="rule"></p>
  </div>

<script>
const ASSETS = '../../SugarCap/Resources';
const CHAR_DIR = '../assets/characters';
// 브라우저가 옛 poses.json·그림을 캐시해 새 자세가 안 보였다(2026-10-27). 열 때마다 새로 받는다.
const V = `v=${Date.now()}`;
const H = 852, W = 393;
const STEPS = [0, 30, 50, 80, 100];

// CupView 사진 틀: 높이 0.84H, 아래에서 0.04H 올림(2026-10-05 탭 바 제거 뒤), 가운데 정렬로 폭을 넘친다(937×1666).
const PHOTO_H = H * 0.84;
const PHOTO_W = PHOTO_H * 937 / 1666;
const PHOTO_TOP = H - H * 0.04 - PHOTO_H;
const PHOTO_LEFT = (W - PHOTO_W) / 2;
const photoPoint = (nx, ny) => ({ x: PHOTO_LEFT + nx * PHOTO_W, y: PHOTO_TOP + ny * PHOTO_H });

// 캐릭터마다 컵 사진·규칙이 다르다. 자세(그림·자리·움직임·단계)는 <캐릭터>/poses.json(앱과 같은 파일). 로슈 = 딸기라떼·당, 카인 = 아이스 아메리카노·카페인.
// rim: 사진 기준 가장자리 타원(가운데 열의 뒤·앞 가장자리 선), 단계마다 사진이 달라 따로 쟀다(가운데 열 x 467).
// liquid: 로슈는 음료·얼음 윗면, 카인은 잠긴 얼음이 끝나고 진한 커피만 남는 선(헤엄 자리 x 범위에서 밝기 90 경계로 잼, 2026-10-07).
// scale: 대표님 그림은 2500 캔버스 픽셀 크기로 그렸다. 목업에서 잰 배율을 사진 높이에 묶는다.
// 카인 배율: 목업(2026-09-29)의 앉기·헤엄 크기를 잔 가장자리 폭 대비로 옮긴 값(가장자리 폭 683px ↔ 사진 447px)이
// 작다는 대표님 피드백으로 1.3배. 목업 화면 속 크기(앉기 1.17배·서기 1.44배)의 중간.
const CHARS = {
  roshu: {
    label: '로슈',
    cup: 'strawberry-latte',
    side: 'sugar', kicker: '오늘 남은 당', unit: 'g', limit: 50, color: '#698394',
    fact: '적당한 당은 기분에도 좋아요. 물론 생존에도 필요하고요.',
    bottom: 0.885,
    rim: { 0: [0.2626, 0.3280], 30: [0.2605, 0.3247], 50: [0.2614, 0.3247], 80: [0.2581, 0.3235], 100: [0.2686, 0.3268] },
    liquid: { 0: 0.80, 30: 0.557, 50: 0.4466, 80: 0.3511, 100: 0.3397 },
    // 목업 배율에서 대표님 지시로 0.9배.
    scale: PHOTO_H * 7.96e-5 * 0.9,
    lidPad: 0.35,
    rule: '규칙: 0%면 철푸덕. 철푸덕은 30% 이하에서도 뽑힌다. 나머지는 앱을 열 때마다 허용된 자세 중 하나를 뽑고, 자세 사이 전환은 없다. 컵 안(가장자리 매달리기)은 50% 이하로 남았을 때만 나온다(0% 제외).',
  },
  kain: {
    label: '카인',
    cup: 'iced-americano',
    side: 'caffeine', kicker: '오늘 남은 카페인', unit: 'mg', limit: 400, color: '#4A3226',
    fact: '전설에 따르면 커피 열매는 염소가 먼저 맛봤어요.',
    bottom: 0.876,
    rim: { 0: [0.2629, 0.3283], 30: [0.2629, 0.3271], 50: [0.2641, 0.3259], 80: [0.2629, 0.3271], 100: [0.2683, 0.3265] },
    liquid: { 0: 0.87, 30: 0.782, 50: 0.668, 80: 0.568, 100: 0.537 },
    scale: PHOTO_H * 0.0818 * 1.3 / 1666,
    // 카인 눈은 흰 고리라 눈꺼풀을 넉넉히 키우면 몸 밖으로 삐져나온다.
    lidPad: 0.04,
    rule: '규칙(초안): 0%면 바닥에 앉기. 헤엄은 커피가 50% 이상 남았을 때만(30%는 얼음 밑 공간이 한 바퀴 원보다 좁다). 나머지(가장자리에 서기·가장자리 뒤 앉기·걷기·바닥에 앉기)는 1% 이상 어느 단계에서나 뽑힌다. 앱을 열 때마다 허용된 자세 중 하나를 뽑고, 자세 사이 전환은 없다.',
  },
};
let C = CHARS.roshu;
const artOf = name => C.poses[name].art;
// 그림마다 캔버스 속 캐릭터 크기가 달라 앱은 export_ios.py ART_NORM 배율을 번들 idle-rig.json 캔버스에 구워 둔다. 그 비율을 그대로 쓴다.
// away(잔 뒤 물러나기)는 앱 IdleSprite처럼 걷기 그림 키 ÷ 이 그림 키(번들 캔버스 기준)에 away.scale을 더 곱한다.
const awayRatio = name => {
  const away = C.poses[name].away, art = artOf(name), walk = state.meta?.walk;
  if (!away || !walk) return 1;
  const h = (a, k) => (a.bbox[3] - a.bbox[1]) * (C.norm[k] ?? 1);
  return h(walk, 'walk') / h(state.meta[art], art) * away.scale;
};
const scaleOf = name => C.scale * (C.norm[artOf(name)] ?? 1) * awayRatio(name);

const allowed = (pose, step) => {
  const p = C.poses[pose];
  if (p.maxStep !== undefined && step > p.maxStep) return false;
  if (p.minStep !== undefined && step < p.minStep) return false;
  return true;
};
const autoPose = step => {
  if (step === 0) return C.zero;
  const pool = Object.keys(C.poses).filter(k => allowed(k, step));
  return pool[Math.floor(Math.random() * pool.length)];
};

const state = { char: 'roshu', step: 100, pose: 'auto', picked: null, reduce: false, meta: null, parts: null };

// ── 스프라이트 ────────────────────────────────────────────
// 그림 한 장을 몸통과 팔다리 레이어로 나눴다(design/assets/characters/split_limbs.py).
// 발(foot*)은 바닥 층이라 몸이 까치발을 해도 제자리다. 팔과 카인 다리(leg*)는 몸 층에 붙어 몸을 따라간다.
const isFoot = n => n.startsWith('foot');

function partImg(pose, name, frame, pivot, s) {
  const img = new Image();
  img.src = `${CHAR_DIR}/${state.char}/parts/${pose}/${name}.png?${V}`; img.alt = '';
  const [x, y, w, h] = frame;
  Object.assign(img.style, { left: `${x * s}px`, top: `${y * s}px`, width: `${w * s}px`, height: `${h * s}px` });
  if (pivot) img.style.transformOrigin = `${(pivot[0] - x) * s}px ${(pivot[1] - y) * s}px`;
  return img;
}

// 기준점 = 그림 bbox 아래 가운데(pivot: rimLine이면 그림 속 가장자리 틈, center면 bbox 가운데). 전체 변형은 그 점을 중심으로 한다.
function makeSprite(name) {
  const art = artOf(name), m = state.meta[art], rig = state.parts[art], s = scaleOf(name);
  const [bx0, by0, bx1, by1] = m.bbox;
  const el = document.createElement('div');
  el.className = 'sprite';
  if (C.poses[name].opacity !== undefined) el.style.opacity = String(C.poses[name].opacity);
  el.style.width = `${m.canvas[0] * s}px`;
  el.style.height = `${m.canvas[1] * s}px`;
  const pivotY = { rimLine: m.rimLineY, center: (by0 + by1) / 2 }[C.poses[name].pivot] ?? by1;
  const pivot = { x: (bx0 + bx1) / 2 * s, y: pivotY * s, footY: by1 * s };
  el.style.transformOrigin = `${pivot.x}px ${pivot.y}px`;

  const ground = document.createElement('div');
  const body = document.createElement('div');
  // 각설탕(rig.cube): 면 조각은 캐릭터 밑에 따로 깔고, 캐릭터(ground·body)는 rider 층에 넣어 윗면을 따라가게 한다.
  let cube = null, host = el;
  if (rig.cube) {
    const under = document.createElement('div'), rider = document.createElement('div');
    for (const g of [under, rider]) { g.className = 'layer'; g.style.transformOrigin = '0 0'; el.appendChild(g); }
    const faces = rig.parts.filter(q => q.z === 'cube').map(q => {
      const img = partImg(art, q.name, q.frame, null, s);
      img.style.transformOrigin = `${-q.frame[0] * s}px ${-q.frame[1] * s}px`;
      under.appendChild(img);
      return { name: q.name, img };
    });
    cube = { geo: rig.cube, faces, rider };
    host = rider;
  }
  for (const g of [ground, body]) { g.className = 'layer'; host.appendChild(g); }
  body.style.transformOrigin = `${pivot.x}px ${pivot.footY}px`;
  const limbs = {}, draw = [];
  const add = (parent, part) => {
    const img = partImg(art, part.name, part.frame, part.pivot, s);
    parent.appendChild(img);
    limbs[part.name] = img;
    draw.push({ img, frame: part.frame, limb: part.name, pivot: part.pivot, onBody: parent === body });
  };
  for (const part of rig.parts.filter(q => q.z === 'back')) add(isFoot(part.name) ? ground : body, part);
  const bodyImg = partImg(art, 'body', rig.body, null, s);
  body.appendChild(bodyImg);
  draw.push({ img: bodyImg, frame: rig.body, limb: null, pivot: null, onBody: true });
  const lids = m.eyes.map(e => {
    const [x0, y0, x1, y1] = e.box, pad = C.lidPad;
    const w = (x1 - x0) * (1 + pad * 2), h = (y1 - y0) * (1 + pad * 2);
    const lid = document.createElement('div');
    lid.className = 'lid';
    Object.assign(lid.style, { left: `${(x0 - (x1 - x0) * pad) * s}px`, top: `${(y0 - (y1 - y0) * pad) * s}px`, width: `${w * s}px`, height: `${h * s}px`, background: e.lid, transform: 'scaleY(0)' });
    body.appendChild(lid);
    return lid;
  });
  // 바꿔 끼우는 조각(감은 눈 등): 눈꺼풀 위, 돌지 않고 show.<이름>이 0.5 이상일 때만 보인다(앱과 같다).
  const overlays = {};
  for (const part of rig.parts.filter(q => q.z === 'overlay')) {
    const img = partImg(art, part.name, part.frame, null, s);
    img.style.visibility = 'hidden';
    body.appendChild(img);
    overlays[part.name] = img;
  }
  for (const part of rig.parts.filter(q => q.z === 'front')) add(body, part);
  // 잔 앞 조각(z cup, 빼꼼 로슈 손): 누끼로 지우는 층 밖에 따로 두고, 몸의 가로 미끄러짐(dx)을 따르지 않는다(앱 drawBehindCup).
  const cupParts = rig.parts.filter(q => q.z === 'cup');
  let front = null;
  if (cupParts.length) {
    front = document.createElement('div');
    front.className = 'sprite';
    Object.assign(front.style, { width: el.style.width, height: el.style.height, transformOrigin: el.style.transformOrigin });
    for (const part of cupParts) front.appendChild(partImg(art, part.name, part.frame, part.pivot, s));
  }
  const feet = rig.parts.filter(q => isFoot(q.name)).map(q => ({ name: q.name, x: (q.frame[0] + q.frame[2] / 2) * s, w: q.frame[2] * s }));
  return { name, el, front, body, limbs, overlays, draw, feet, pivot, lids, cube, blink: newBlinker() };
}

// 눈 깜빡임: 2.5~5.5초 간격, 가끔 두 번. 닫힘 0.07초·열림 0.1초.
function newBlinker() {
  let next = 1 + Math.random() * 2, double = false;
  return t => {
    const d = t - next;
    if (d > 0.4) { double = Math.random() < 0.2; next = t + 2.5 + Math.random() * 3; return 0; }
    const one = x => x < 0 ? 0 : x < 0.07 ? x / 0.07 : x < 0.17 ? 1 - (x - 0.07) / 0.1 : 0;
    return Math.max(one(d), double ? one(d - 0.22) : 0);
  };
}

// ── 자세별 동작(시각 t의 순수 함수) ───────────────────────
const TAU = Math.PI * 2;
const smooth = x => { const c = Math.min(Math.max(x, 0), 1); return c * c * (3 - 2 * c); };
// 0→1→0 한 번(길이 len초). 시작 전·끝난 뒤는 0.
const bump = (u, len) => (u < 0 || u > len) ? 0 : Math.sin(Math.PI * u / len) ** 2;

// 자세 기준점이 놓일 사진 위 자리(poses.json place, 앱 IdlePlace와 같다).
// x = 사진 폭 비율, xRim = 잔 가운데로부터 가장자리 폭 단위(가장자리 폭 = 사진 폭의 .477, 가운데 .498. 카인 목업에서 잰 값).
// y = bottom(잔 바닥)·rimFront·rimBack(가장자리 선)에 dy를 더하거나, liquid(음료 윗면~floor 사이 depth 깊이).
// centered면 그림 가운데가 그 자리에 오게 기준점(발끝)을 그림 높이 절반만큼 내린다.
const RIM = { mid: 0.498, width: 0.477 };
function placeOf(name) {
  const p = C.poses[name].place;
  const x = p.x ?? RIM.mid + p.xRim * RIM.width;
  if (p.y === 'liquid') {
    const top = C.liquid[state.step];
    const mid = photoPoint(x, top + (p.floor - top) * p.depth);
    if (!p.centered) return mid;
    const [, by0, , by1] = state.meta[artOf(name)].bbox;
    return { x: mid.x, y: mid.y + (by1 - by0) / 2 * scaleOf(name) };
  }
  const [back, front] = C.rim[state.step];
  const y = { bottom: C.bottom, rimFront: front, rimBack: back }[p.y];
  return photoPoint(x, y + (p.dy ?? 0));
}

// 걷기: 오른쪽 끝(.74) ↔ 왼쪽 끝(.28)을 오가고 끝에서 쉰다. 두 캐릭터 그림 다 왼쪽을 본다.
// 카인은 몸이 작아 보폭·속도를 줄였다.
const WALKS = {
  roshu: { from: 0.74, to: 0.28, speed: 20, pause: 1.6, stride: 10 },
  kain: { from: 0.74, to: 0.28, speed: 14, pause: 2.2, stride: 6 },
};
// 한 발의 한 주기(u 0~1). 앞 절반은 들어서 앞으로(그림 기준 -x) 내딛기, 뒤 절반은 바닥을 딛고 뒤로 밀리기.
const STEP = { reach: 1.5, lift: 1.6, rot: 8 };
function step(u) {
  if (u < 0.5) {
    const v = u / 0.5, arc = Math.sin(Math.PI * v);
    return { x: STEP.reach - 2 * STEP.reach * smooth(v), lift: STEP.lift * arc, rot: STEP.rot * arc };
  }
  return { x: -STEP.reach + 2 * STEP.reach * (u - 0.5) / 0.5, lift: 0, rot: 0 };
}
function walkAt(t) {
  const WALK = WALKS[state.char];
  const dist = (WALK.from - WALK.to) * PHOTO_W, dur = dist / WALK.speed;
  const cycle = 2 * (dur + WALK.pause);
  const u = ((t % cycle) + cycle) % cycle;
  let d, facingLeft, moving;
  if (u < dur) { d = u * WALK.speed; facingLeft = true; moving = true; }
  else if (u < dur + WALK.pause) { d = dist; facingLeft = true; moving = false; }
  else if (u < 2 * dur + WALK.pause) { d = dist - (u - dur - WALK.pause) * WALK.speed; facingLeft = false; moving = true; }
  else { d = 0; facingLeft = false; moving = false; }
  const x = PHOTO_LEFT + WALK.from * PHOTO_W - d;
  const phase = moving ? (u < dur ? d : dist * 2 - d) / WALK.stride : 0;
  return { x, facingLeft, moving, phase };
}

// 반환: 전체(dx, dy, rot, flip) · 몸 층(bodyDy, sx, sy) · 팔다리 각도(limbs, 크기만. 방향은 limbDirection) · 팔다리 이동(shift, [x, y] px).
// 움직임 = poses.json motion 줄마다 amp × 파형(t)을 더한다(앱 IdleChannel과 같다). walk가 있으면 정해진 걷기 동작.
// 좌우반전 자세(mirror)는 flip에 곱해 CSS·그림자·반사가 한 값을 쓴다.
const mod = (v, p) => ((v % p) + p) % p;
const SHAPES = {
  wave: (c, t) => {
    const k = Math.sin(TAU * t / c.period + (c.phase ?? 0));
    return c.rectify === 'pos' ? Math.max(0, k) : c.rectify === 'neg' ? Math.max(0, -k) : k;
  },
  plateau: (c, t) => {
    const v = mod(t, c.period);
    return smooth(v < c.rise ? v / c.rise : v < c.rise + c.hold ? 1 : 1 - (v - c.rise - c.hold) / c.fall);
  },
  bump: (c, t) => bump(mod(t, c.period) - c.at, c.length),
  arch: (c, t) => {
    const u = mod(t, c.period) - c.at;
    return (u < 0 || u > c.length) ? 0 : Math.sin(Math.PI * u / c.length);
  },
  // at초부터 length초 동안 0→1, 끝나면 1로 있다가 다음 주기에 0. amp 360이면 한 바퀴가 이음매 없이 이어진다.
  spin: (c, t) => smooth((mod(t, c.period) - c.at) / c.length),
};
const still = () => ({ dx: 0, dy: 0, rot: 0, flip: 1, cube: 0, bodyDy: 0, sx: 1, sy: 1, limbs: {}, shift: {}, show: {} });
function motion(name, t) {
  const pose = C.poses[name];
  let m;
  if (pose.walk) {
    m = WALK_STYLES[pose.walk](name, t);
  } else {
    m = still();
    for (const c of pose.motion ?? []) {
      const v = c.amp * SHAPES[c.shape](c, t);
      if (c.to.startsWith('limb.')) {
        const limb = c.to.slice(5);
        m.limbs[limb] = (m.limbs[limb] ?? 0) + v;
      } else if (c.to.startsWith('show.')) {
        const part = c.to.slice(5);
        m.show[part] = (m.show[part] ?? 0) + v;
      } else if (c.to.startsWith('lift.')) {
        const part = c.to.slice(5);
        const [sx, sy] = m.shift[part] ?? [0, 0];
        m.shift[part] = [sx, sy + v];
      } else {
        m[c.to] += v;
      }
    }
  }
  if (pose.mirror) m.flip = -m.flip;
  return m;
}

const WALK_STYLES = {
  // 로슈: 몸은 흔들지 않고 다리로 걷는다. 한 발씩 들어 앞으로 내딛고, 딛은 발은 뒤로 밀린다.
  step(name, t) {
    const m = still(), w = walkAt(t);
    m.dx = w.x - placeOf(name).x;
    m.flip = w.facingLeft ? 1 : -1;
    if (w.moving) {
      const c = (w.phase / 2) % 1;
      for (const [foot, u] of [['foot_back', c], ['foot_front', (c + 0.5) % 1]]) {
        const g = step(u);
        m.limbs[foot] = g.rot;
        m.shift[foot] = [g.x, -g.lift];
      }
      // 팔은 반대쪽 다리와 같이 앞뒤로: 앞 지느러미는 어깨를 축으로 +가 앞(바깥), 옆 지느러미는 반대 박자.
      const swing = Math.cos(TAU * c);
      m.limbs.flipper_front = 12 * swing;
      m.limbs.flipper_side = -8 * swing;
    } else {
      m.limbs.flipper_side = 3 * Math.sin(TAU * t / 3.0);
    }
    return m;
  },
  // 카인 뒤뚱 걷기: 두 다리가 엉덩이를 축으로 엇갈려 흔들리고(+가 앞), 앞으로 가는 다리는 살짝 든다.
  // 몸은 딛는 다리 쪽으로 조금 기운다.
  waddle(name, t) {
    const m = still(), w = walkAt(t);
    m.dx = w.x - placeOf(name).x;
    m.flip = w.facingLeft ? 1 : -1;
    if (w.moving) {
      const c = (w.phase / 2) % 1, k = Math.sin(TAU * c), lift = Math.cos(TAU * c);
      m.limbs.leg_near = 8 * k;
      m.limbs.leg_far = -8 * k;
      m.shift.leg_near = [0, -0.7 * Math.max(0, lift)];
      m.shift.leg_far = [0, -0.7 * Math.max(0, -lift)];
      m.rot = 1.5 * k;
    }
    return m;
  },
};

// 그림자: 넓고 옅은 그늘(그림 폭 비율) + 발밑 접지. 걷기는 발마다 접지가 있어 발을 들면 작고 옅어진다.
// 빛은 왼쪽 앞 위(사진의 컵 밝은 면)라 그늘은 오른쪽 뒤로 조금 밀린다.
// 철푸덕은 바닥에 누워 몸이 바닥에 닿아 있으니 그늘을 밀지 않고 몸 바로 밑에 좁게 둔다.
// 카인 바닥 앉기도 엉덩이가 바닥에 닿아 몸 밑에 좁게. 가장자리 위 자세와 헤엄은 바닥 그림자가 없다.
// 값은 poses.json shadow(그림 폭 비율). feet: 발마다 접지(로슈 걷기). 없으면 몸 밑 접지 하나.
function makeShadow(sp) {
  const c = C.poses[sp.name].shadow;
  if (!c) return [];
  const [bx0, , bx1] = state.meta[artOf(sp.name)].bbox;
  const bw = (bx1 - bx0) * scaleOf(sp.name);
  const shade = (kind, w, h) => {
    const el = document.createElement('div');
    el.className = `shade ${kind}`;
    Object.assign(el.style, { width: `${w}px`, height: `${h}px` });
    return { el, w, h };
  };
  if (sp.cube) {
    // 각설탕: 앞 아래 꼭짓점에서 오른쪽으로 납작한 띠(앱 drawShadow). 뒤집어도 띠는 늘 오른쪽.
    const corner = sp.cube.geo.origin[0] * scaleOf(sp.name) - sp.pivot.x;
    return [
      { ...shade('ambient', bw * c.w, bw * c.h), corner, dx: bw * (c.dx + c.w / 2), dy: bw * c.dy },
      { ...shade('contact', bw * c.w / 2, bw * c.h / 2), corner, dx: bw * (c.dx + c.w / 4), dy: bw * c.dy },
    ];
  }
  const out = [{ ...shade('ambient', bw * c.w * 1.35, bw * c.h), dx: bw * c.dx, dy: bw * c.dy }];
  if (c.feet) {
    for (const f of sp.feet) out.push({ ...shade('contact', f.w * 1.5, bw * 0.08), foot: f });
  } else {
    out.push({ ...shade('contact', bw * c.w * 0.9, bw * 0.07), dx: bw * c.dx * 0.2, dy: -0.5 });
  }
  return out;
}

// 팔다리 하나의 변형(CSS·캔버스 공용). 팔다리는 이음새 한쪽 끝을 축으로, 반대쪽 끝이 몸 안으로 숨는 방향으로만 돈다
// (limbDirection: CSS 각도 부호. 0은 양쪽 다). limbDirection에 없는 팔다리는 돌지 않는다(앱과 같다).
function limbPose(sp, m, limb) {
  const amount = m.limbs[limb] ?? 0, dir = C.poses[sp.name].limbDirection?.[limb];
  const angle = dir === undefined ? 0 : dir === 0 ? amount : dir * Math.max(0, amount);
  const [mx, my] = m.shift[limb] ?? [0, 0];
  return { angle, mx, my };
}

// ── 각설탕(앱 IdleCubeMath를 옮김) ─────────────────────────
// 아핀 [a, b, c, d, e, f]: (x, y) → (a x + c y + e, b x + d y + f). CSS matrix()와 같은 순서.
const aff = {
  then: (p, q) => [q[0] * p[0] + q[2] * p[1], q[1] * p[0] + q[3] * p[1], q[0] * p[2] + q[2] * p[3], q[1] * p[2] + q[3] * p[3],
    q[0] * p[4] + q[2] * p[5] + q[4], q[1] * p[4] + q[3] * p[5] + q[5]],
  inv: p => {
    const det = p[0] * p[3] - p[1] * p[2];
    const a = p[3] / det, b = -p[1] / det, c = -p[2] / det, d = p[0] / det;
    return [a, b, c, d, -(a * p[4] + c * p[5]), -(b * p[4] + d * p[5])];
  },
  css: p => `matrix(${p.join(',')})`,
};
const v3 = {
  dot: (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2],
  add: (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]],
  norm: a => { const l = Math.hypot(...a); return a.map(v => v / l); },
};
function cubeTurn(deg) {
  const a = deg * Math.PI / 180, ang = -a, [x, y, z] = a >= 0 ? [1, 0, 0] : [0, 0, 1];
  const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
  const m = [[t * x * x + c, t * x * y - s * z, t * x * z + s * y], [t * x * y + s * z, t * y * y + c, t * y * z - s * x], [t * x * z - s * y, t * y * z + s * x, t * z * z + c]];
  return p => [v3.dot(m[0], p), v3.dot(m[1], p), v3.dot(m[2], p)];
}
function cubePose(g, deg, s) {
  const turn = cubeTurn(deg);
  const project = p => [(g.origin[0] + p[0] * g.ex[0] + p[1] * g.ey[0] + p[2] * g.ez[0]) * s,
    (g.origin[1] + p[0] * g.ex[1] + p[1] * g.ey[1] + p[2] * g.ez[1]) * s];
  const frame = (o, u, v) => {
    const po = project(o), pu = project(v3.add(o, u)), pv = project(v3.add(o, v));
    return [pu[0] - po[0], pu[1] - po[1], pv[0] - po[0], pv[1] - po[1], po[0], po[1]];
  };
  const det = g.ey[0] * g.ez[1] - g.ez[0] * g.ey[1];
  let view = [0, 1, 0];
  if (Math.abs(det) > 1e-9) {
    const bx = -g.ex[0], by = -g.ex[1];
    view = v3.norm([1, (bx * g.ez[1] - g.ez[0] * by) / det, (g.ey[0] * by - bx * g.ey[1]) / det]);
    if (view[1] < 0) view = view.map(v => -v);
  }
  const left = v3.norm([g.ex[0] < 0 ? 1 : -1, 0, g.ez[0] > 0 ? -1 : 1]);
  const light = v3.norm([view[0] + 0.6 * left[0], view[1] + 1.2, view[2] + 0.6 * left[2]]);
  const bright = n => 0.62 + 0.38 * Math.max(0, v3.dot(n, light));
  const faces = {};
  for (const f of g.faces) {
    const n = turn(f.normal);
    if (v3.dot(n, view) <= 0) continue;
    const [o, u, v] = f.span;
    faces[f.name] = { m: aff.then(aff.inv(frame(o, u, v)), frame(turn(o), turn(u), turn(v))), shade: bright(n) / bright(f.normal) };
  }
  const stand = [g.stand[0], 1, g.stand[1]];
  const from = project(stand), to = project(turn(stand));
  const up0 = project([0, 1, 0]), up1 = project(turn([0, 1, 0])), base = project([0, 0, 0]);
  const tilt = (Math.atan2(up1[1] - base[1], up1[0] - base[0]) - Math.atan2(up0[1] - base[1], up0[0] - base[0])) * (1 - g.lean);
  const c = Math.cos(tilt), sn = Math.sin(tilt);
  const rider = aff.then(aff.then([1, 0, 0, 1, -from[0], -from[1]], [c, sn, -sn, c, 0, 0]), [1, 0, 0, 1, to[0], to[1]]);
  return { faces, rider };
}
// 뒤집은 자세도 각설탕은 원화 방향: 앞 아래 꼭짓점 세로선을 축으로 한 번 더 뒤집는다(앱 drawCube).
function applyCube(sp, m) {
  const s = scaleOf(sp.name), g = sp.cube.geo, pose = cubePose(g, m.cube, s);
  const axis = g.origin[0] * s;
  const unflip = m.flip < 0 ? [-1, 0, 0, 1, 2 * axis, 0] : [1, 0, 0, 1, 0, 0];
  for (const f of sp.cube.faces) {
    const d = pose.faces[f.name];
    f.img.style.display = d ? '' : 'none';
    if (!d) continue;
    f.img.style.transform = aff.css(aff.then(d.m, unflip));
    f.img.style.filter = Math.abs(d.shade - 1) > 0.002 ? `brightness(${d.shade})` : '';
  }
  sp.cube.rider.style.transform = aff.css(aff.then(aff.then(unflip, pose.rider), unflip));
}

function apply(sp, t, blinkOn) {
  const base = placeOf(sp.name), m = motion(sp.name, t);
  const cx = base.x + m.dx;
  const x = cx - sp.pivot.x, y = base.y + m.dy - sp.pivot.y;
  sp.el.style.transform = `translate(${x}px, ${y}px) rotate(${m.rot}deg) scaleX(${m.flip})`;
  if (sp.front) sp.front.style.transform = `translate(${x - m.dx}px, ${y}px) rotate(${m.rot}deg) scaleX(${m.flip})`;
  sp.body.style.transform = `translateY(${m.bodyDy}px) scale(${m.sx}, ${m.sy})`;
  if (sp.cube) applyCube(sp, m);
  for (const [limb, img] of Object.entries(sp.limbs)) {
    const l = limbPose(sp, m, limb);
    img.style.transform = `translate(${l.mx}px, ${l.my}px) rotate(${l.angle}deg)`;
  }
  for (const [part, img] of Object.entries(sp.overlays)) img.style.visibility = (m.show?.[part] ?? 0) >= 0.5 ? 'visible' : 'hidden';
  const b = blinkOn ? sp.blink(t) : 0;
  for (const lid of sp.lids) lid.style.transform = `scaleY(${b})`;
  for (const sh of sp.shades) {
    let sx = cx + (sh.dx ?? 0), sy = base.y + (sh.dy ?? 0), k = 1;
    if (sh.corner !== undefined) {
      sx = cx + sh.corner * m.flip + sh.dx;
    } else if (sh.foot) {
      const [mx, my] = m.shift[sh.foot.name] ?? [0, 0];
      sx = cx + (sh.foot.x + mx - sp.pivot.x) * m.flip;
      k = 1 - 0.45 * Math.min(1, -my / STEP.lift);
    }
    sh.el.style.transform = `translate(${sx - sh.w / 2}px, ${sy - sh.h / 2}px) scale(${k})`;
    sh.el.style.opacity = String(k);
  }
  if (sp.bubbles) {
    const dots = bubblesAt(sp, base, t);
    sp.bubbles.forEach((el, i) => {
      const d = dots[i];
      el.style.display = d ? 'block' : 'none';
      if (d) Object.assign(el.style, { transform: `translate(${d.x - d.r}px, ${d.y - d.r}px)`, width: `${2 * d.r}px`, height: `${2 * d.r}px`, opacity: String(d.alpha) });
    });
  }
  sp.state = { base, m, cx };
}

// 숨 쉬듯 나오는 흰 기포 점(poses.json bubbles, 앱 IdleMotion.bubbles와 같다). every초마다 count개를 gap초 간격으로.
// 나오는 자리는 그 순간 그림 속 from(부리 끝)이 있던 화면 자리, 나온 뒤엔 몸을 따라가지 않고 life초 동안 rise만큼 곧게 오른다.
function bubblesAt(sp, base, t) {
  const b = C.poses[sp.name].bubbles, s = scaleOf(sp.name), out = [];
  const spread = (b.count - 1) * b.gap;
  for (let k = Math.trunc((t - b.life - spread) / b.every) - 1; k <= Math.trunc(t / b.every) + 1; k++) {
    for (let j = 0; j < b.count; j++) {
      const emit = k * b.every + j * b.gap, age = t - emit;
      if (age < 0 || age >= b.life) continue;
      const m = motion(sp.name, emit), r = m.rot * Math.PI / 180;
      const lx = (b.from[0] * s - sp.pivot.x) * m.flip, ly = b.from[1] * s - sp.pivot.y;
      const p = age / b.life;
      out.push({
        x: base.x + m.dx + Math.cos(r) * lx - Math.sin(r) * ly + 0.8 * Math.sin(TAU * age / 0.7 + j * 1.7),
        y: base.y + m.dy + Math.sin(r) * lx + Math.cos(r) * ly - b.rise * p,
        r: b.size * Math.max(0.4, 1 - 0.22 * j) * (1 + 0.25 * p),
        alpha: 0.85 * Math.min(1, age / 0.1) * Math.min(1, (1 - p) / 0.4),
      });
    }
  }
  return out;
}

function makeBubbles(sp) {
  const b = C.poses[sp.name].bubbles;
  if (!b) return null;
  const n = b.count * (Math.ceil(b.life / b.every) + 1);
  return Array.from({ length: n }, () => {
    const el = document.createElement('div');
    el.className = 'bubble';
    return el;
  });
}

// ── 유리 반사 ─────────────────────────────────────────────
// 대표님 레퍼런스(2026-09-29 스크린샷 5장)대로: 반사 = 몸통만 있는 매끈한 윤곽(팔다리·얼굴 없음), 크기는 캐릭터 그대로.
// 캐릭터 중심에서 잔 중심 쪽으로 거리의 toward만큼 당기고 위로 up(pt) 올린다. 유리 밖은 누끼 마스크로 잘리고,
// 가장자리는 선명하게 둔다(대표님 지시). 값은 레퍼런스에서 쟀다.
// 카인은 대표님 목업(2026-09-29, 바닥에 앉은 카인이 잔 왼쪽 아래에 비침)대로: 그림 전체가 색 그대로 옅게,
// 좌우반전(부리가 캐릭터 쪽), 가로만 .45배로 눌림, 높이·세로 위치는 캐릭터와 같다. 불투명도는 흰 눈 고리 밝기로 쟀다.
// 자세별 자리(toward·up·mirror)는 poses.json reflection, 캐릭터별 모양은 여기.
const REFLECTS = {
  roshu: { look: { full: false, mirror: false, squeeze: 1, opacity: 0.42 } },
  kain: { look: { full: true, mirror: true, squeeze: 0.45, opacity: 0.45 } },
};
const BODY_COLOUR = '#D5D7DD';
const geo = { ready: false };

const VERT = `attribute vec2 aPos; uniform vec2 uSize; varying vec2 vPos;
void main() { vPos = vec2((aPos.x * 0.5 + 0.5) * uSize.x, (0.5 - aPos.y * 0.5) * uSize.y); gl_Position = vec4(aPos, 0.0, 1.0); }`;
// 화면 점 -> 캐릭터 그림 위 점: 반사 자리(uTo)를 캐릭터 자리(uFrom)로 되돌린다. 가로는 반사 가운데를 축으로
// uFlip(-1 = 좌우반전)과 uSqueeze(가로 눌림)를 되돌린다.
const FRAG = `precision highp float;
uniform sampler2D uTex; uniform vec2 uSize, uFrom, uTo; uniform float uAlpha, uFlip, uSqueeze;
varying vec2 vPos;
void main() {
  vec2 p = vec2(uFrom.x + (vPos.x - uTo.x) * uFlip / uSqueeze, vPos.y - uTo.y + uFrom.y);
  if (p.x < 0.0 || p.y < 0.0 || p.x > uSize.x || p.y > uSize.y) { gl_FragColor = vec4(0.0); return; }
  gl_FragColor = texture2D(uTex, p / uSize) * uAlpha;
}`;

function initGlass() {
  const canvas = document.getElementById('glass'), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
  const gl = canvas.getContext('webgl', { premultipliedAlpha: true, alpha: true });
  const shader = (type, src) => {
    const sh = gl.createShader(type); gl.shaderSource(sh, src); gl.compileShader(sh);
    if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(sh));
    return sh;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, shader(gl.VERTEX_SHADER, VERT));
  gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, FRAG));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  for (const [k, v] of [[gl.TEXTURE_MIN_FILTER, gl.LINEAR], [gl.TEXTURE_MAG_FILTER, gl.LINEAR], [gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE], [gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE]]) gl.texParameteri(gl.TEXTURE_2D, k, v);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
  const u = name => gl.getUniformLocation(prog, name);
  const paper = document.createElement('canvas');
  paper.width = canvas.width; paper.height = canvas.height;
  geo.gl = gl; geo.u = u; geo.paper = paper; geo.dpr = dpr;
}

// 누끼 알파에서 잔 옆선을 재 원뿔을 맞춘다(한 번, 단계마다).
function measureGlass(step) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = img.naturalWidth; c.height = img.naturalHeight;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      const a = ctx.getImageData(0, 0, c.width, c.height).data, iw = c.width, ih = c.height;
      const kx = PHOTO_W / iw, ky = PHOTO_H / ih;
      const [back, front] = C.rim[step];
      const rows = [];
      for (let py = Math.round((front + 0.04) * ih); py < Math.round((C.bottom - 0.08) * ih); py += 4) {
        let x0 = -1, x1 = -1;
        for (let px = 0; px < iw; px++) if (a[(py * iw + px) * 4 + 3] > 128) { if (x0 < 0) x0 = px; x1 = px; }
        if (x0 >= 0) rows.push({ y: PHOTO_TOP + py * ky, half: (x1 - x0) / 2 * kx, mid: PHOTO_LEFT + (x0 + x1) / 2 * kx });
      }
      const n = rows.length, my = rows.reduce((t, r) => t + r.y, 0) / n, mh = rows.reduce((t, r) => t + r.half, 0) / n;
      const b = rows.reduce((t, r) => t + (r.y - my) * (r.half - mh), 0) / rows.reduce((t, r) => t + (r.y - my) ** 2, 0);
      const aa = mh - b * my;
      const axis = rows.reduce((t, r) => t + r.mid, 0) / n;
      const axisPx = Math.round((axis - PHOTO_LEFT) / kx);
      let bottomPx = 0;
      for (let py = ih - 1; py > 0; py--) if (a[(py * iw + axisPx) * 4 + 3] > 128) { bottomPx = py; break; }
      const syBottom = PHOTO_TOP + bottomPx * ky;
      const rimY = PHOTO_TOP + (back + front) / 2 * PHOTO_H;
      const sin = (front - back) / 2 * PHOTO_H / (aa + b * rimY), cos = Math.sqrt(1 - sin * sin);
      const y0 = (syBottom - aa * sin) / (1 + b * sin);
      Object.assign(geo, { axis, sin, cos, y0, r0: aa + b * y0, slope: -b * cos, liquid: PHOTO_TOP + C.liquid[step] * PHOTO_H, key: key(step), ready: true });
      resolve();
    };
    img.src = cupSrc('cutout', step);
  });
}

// 반사용 판: 화면과 같은 변형으로 그린다. 로슈는 몸통 조각만 그려 몸 색으로 칠하고, 카인은 다리까지 색 그대로.
function paintSide(ctx, sp, full) {
  const { base, m, cx } = sp.state, pv = sp.pivot, s = scaleOf(sp.name);
  ctx.save();
  ctx.translate(cx, base.y + m.dy);
  ctx.rotate(m.rot * Math.PI / 180);
  ctx.scale(m.flip, 1);
  ctx.translate(-pv.x, -pv.y);
  const bodyTransform = () => {
    ctx.translate(pv.x, pv.footY + m.bodyDy);
    ctx.scale(m.sx, m.sy);
    ctx.translate(-pv.x, -pv.footY);
  };
  for (const d of sp.draw) {
    if (d.limb && !full) continue;
    ctx.save();
    if (d.onBody) bodyTransform();
    if (d.limb) {
      const l = limbPose(sp, m, d.limb), ox = d.pivot[0] * s, oy = d.pivot[1] * s;
      ctx.translate(l.mx + ox, l.my + oy);
      ctx.rotate(l.angle * Math.PI / 180);
      ctx.translate(-ox, -oy);
    }
    const [fx, fy, fw, fh] = d.frame;
    ctx.drawImage(d.img, fx * s, fy * s, fw * s, fh * s);
    ctx.restore();
  }
  if (!full) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-in';
    ctx.fillStyle = BODY_COLOUR;
    ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    ctx.restore();
  }
  ctx.restore();
}

function drawGlass() {
  const { gl, u, paper, dpr } = geo;
  if (!gl) return;
  gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  if (!geo.ready || geo.key !== key(state.step)) return;
  const ctx = paper.getContext('2d');
  const { look } = REFLECTS[state.char];
  for (const sp of sprites) {
    const c = C.poses[sp.name].reflection;
    if (!c || !sp.state) continue;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, paper.width, paper.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    paintSide(ctx, sp, look.full);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, paper);
    const [bx0, , bx1] = state.meta[artOf(sp.name)].bbox;
    const s = scaleOf(sp.name), f = sp.state.m.flip;
    const mid = sp.state.cx + ((bx0 + bx1) / 2 * s - sp.pivot.x) * f;
    gl.uniform2f(u('uSize'), W, H);
    gl.uniform2f(u('uFrom'), mid, 0);
    gl.uniform2f(u('uTo'), mid + (geo.axis - mid) * c.toward, -(c.up ?? 0));
    gl.uniform1f(u('uFlip'), (c.mirror ?? look.mirror) ? -1 : 1);
    gl.uniform1f(u('uSqueeze'), look.squeeze);
    gl.uniform1f(u('uAlpha'), look.opacity);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }
}

// ── 큰 숫자·머리기사(CupHero.swift를 옮김) ─────────────────
// 숫자 바닥 = 사진 .328(잔 앞 입구 선 살짝 아래), 크기 = 화면 폭 32%(자리가 늘면 42% ÷ 글자 폭). 당은 왼쪽, 카페인은 오른쪽 정렬.
// 유리 선(rimline-*)만 숫자를 끊는다. 머리기사(요일·날짜·상식·선)는 라벨 위, 버튼 줄과 겹치면 상식부터 뺀다.
const HERO = {
  baseline: 0.328, unitBaseline: 0.243, digit: 1012 / 2048, comma: 484 / 2048, cap: 1760 / 2048,
  descent: 674 / 2048, unitScale: 0.3, labelGap: 4, labelHeight: 16,
  mastheadGap: 10, mastheadFull: 104, mastheadShort: 64, buttonsBottom: 59 + 50, pad: 24,
};
function renderHero() {
  const hero = document.getElementById('hero');
  const remaining = Math.round(C.limit * state.step / 100);
  const text = remaining.toLocaleString('en-US');
  const ems = [...text].reduce((a, ch) => a + (/\d/.test(ch) ? HERO.digit : HERO.comma), 0);
  const size = Math.min(W * 0.32, W * 0.42 / ems);
  const baseline = PHOTO_TOP + HERO.baseline * PHOTO_H;
  const capTop = baseline - size * HERO.cap;
  const right = C.side === 'caffeine';
  const x = right ? W - HERO.pad : HERO.pad;
  const anchor = right ? 'end' : 'start';
  const rim = `url(${ASSETS}/Assets.xcassets/rimline-${C.cup}-${state.step}.imageset/${state.step}.png?${V})`;
  for (const k of ['maskImage', 'webkitMaskImage']) hero.style[k] = `${rim}, linear-gradient(#000, #000)`;
  for (const k of ['maskSize', 'webkitMaskSize']) hero.style[k] = `${PHOTO_W}px ${PHOTO_H}px, 100% 100%`;
  for (const k of ['maskPosition', 'webkitMaskPosition']) hero.style[k] = `${PHOTO_LEFT}px ${PHOTO_TOP}px, 0 0`;
  const us = size * HERO.unitScale;
  let unitSvg;
  let limitBase;
  if (right) {
    // 카페인: 숫자 바닥 아래 대문자 높이 15% 띄워 단위, 그 아래 2pt 띄워 기준.
    const unitBase = baseline + 0.15 * HERO.cap * size + HERO.cap * us;
    unitSvg = `<text x="${x}" y="${unitBase}" text-anchor="end" font-family="Anton" font-size="${us}" fill="${C.color}">${C.unit}</text>`;
    limitBase = unitBase + HERO.descent * us + 2 + 12.5;
  } else {
    limitBase = PHOTO_TOP + HERO.unitBaseline * PHOTO_H;
    unitSvg = `<text id="hero-unit" y="${limitBase}" font-family="Anton" font-size="${us}" fill="${C.color}">${C.unit}</text>`;
  }
  hero.innerHTML = `
    <svg width="${W}" height="${H}">
      <text id="hero-num" x="${x}" y="${baseline}" text-anchor="${anchor}" font-family="Anton" font-size="${size}" fill="${C.color}">${text}</text>
      ${unitSvg}
      <text id="hero-limit" x="${x}" y="${limitBase}" text-anchor="${anchor}" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" letter-spacing="0.3" fill="rgba(60,60,67,.6)">/${C.limit.toLocaleString('en-US')} ${C.unit}</text>
    </svg>`;
  if (!right) {
    // 당: 숫자 오른쪽 6pt에 단위, 또 6pt에 기준(같은 바닥).
    const place = () => {
      const num = hero.querySelector('#hero-num');
      const unit = hero.querySelector('#hero-unit');
      const lim = hero.querySelector('#hero-limit');
      if (!num || !unit || !lim) return;
      const ux = x + num.getComputedTextLength() + 6;
      unit.setAttribute('x', ux);
      lim.setAttribute('x', ux + unit.getComputedTextLength() + 6);
    };
    place();
    document.fonts.ready.then(place);
  }
  const label = document.createElement('div');
  label.className = 'fixed label';
  label.textContent = C.kicker;
  label.style.color = C.color;
  label.style.top = `${capTop - HERO.labelGap - 13}px`;
  label.style[right ? 'right' : 'left'] = `${HERO.pad}px`;
  hero.appendChild(label);
  const mastheadBottom = capTop - HERO.labelGap - HERO.labelHeight - HERO.mastheadGap;
  const full = mastheadBottom - HERO.mastheadFull >= HERO.buttonsBottom;
  const short = mastheadBottom - HERO.mastheadShort >= HERO.buttonsBottom;
  if (!short) return;
  const now = new Date();
  const m = document.createElement('div');
  m.className = `fixed masthead${right ? ' right' : ''}`;
  m.innerHTML = `<div class="wd" style="color:${C.color}">${now.toLocaleDateString('ko-KR', { weekday: 'long' })}</div>`
    + `<div class="dt">${now.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' })}</div>`
    + (full ? `<div class="fact">${C.fact}</div>` : '') + '<hr>';
  m.style.top = `${mastheadBottom - (full ? HERO.mastheadFull : HERO.mastheadShort)}px`;
  m.style[right ? 'right' : 'left'] = `${HERO.pad}px`;
  hero.appendChild(m);
}

// ── 화면 ─────────────────────────────────────────────────
let sprites = [];
const cupSrc = (kind, step) => `${ASSETS}/Assets.xcassets/${kind}-${C.cup}-${step}.imageset/${step}.png?${V}`;
const key = step => `${C.cup}-${step}`;
function currentPoses() {
  if (state.pose === 'all') return Object.keys(C.poses).filter(k => allowed(k, state.step) || (k === C.zero && state.step === 0));
  if (state.pose === 'auto') return [state.picked];
  return [state.pose];
}
// 잔 누끼만큼 지운 층(잔 뒤에 서기). behindCup(빼꼼)은 원래 색 그대로 이 층만 쓴다.
function cupHost(cutout) {
  const host = document.createElement('div');
  host.className = 'chars';
  for (const k of ['maskImage', 'webkitMaskImage']) host.style[k] = `${cutout}, linear-gradient(#000, #000)`;
  for (const k of ['maskSize', 'webkitMaskSize']) host.style[k] = `${PHOTO_W}px ${PHOTO_H}px, 100% 100%`;
  for (const k of ['maskPosition', 'webkitMaskPosition']) host.style[k] = `${PHOTO_LEFT}px ${PHOTO_TOP}px, 0 0`;
  host.style.maskRepeat = host.style.webkitMaskRepeat = 'no-repeat';
  host.style.maskComposite = 'exclude';
  host.style.webkitMaskComposite = 'xor';
  return host;
}
function awayHost(fade, cutout) {
  const id = `wall-${Math.round(fade * 100)}`;
  if (!document.getElementById(id)) {
    const k = 1 - fade, w = [0xF3, 0xF5, 0xF8].map(c => c / 255 * fade);
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('width', '0'); svg.setAttribute('height', '0');
    svg.style.position = 'absolute';
    svg.innerHTML = `<filter id="${id}" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values="${k} 0 0 0 ${w[0]} 0 ${k} 0 0 ${w[1]} 0 0 ${k} 0 ${w[2]} 0 0 0 1 0"/></filter>`;
    document.body.appendChild(svg);
  }
  const host = cupHost(cutout);
  host.style.filter = `url(#${id})`;
  return host;
}

function render() {
  document.getElementById('cup').src = cupSrc('cup', state.step);
  renderHero();
  for (const [i, d] of [...document.querySelectorAll('.dots i')].entries()) d.classList.toggle('on', (i === 0) === (C.side === 'sugar'));
  document.getElementById('title').textContent = `${C.label} 대기 자세`;
  document.getElementById('rule').textContent = C.rule;
  const layer = document.getElementById('chars'), glass = document.getElementById('glass');
  layer.replaceChildren();
  geo.ready = false;
  geo.pending = measureGlass(state.step);
  const cutout = `url(${cupSrc('cutout', state.step)})`;
  for (const k of ['maskImage', 'webkitMaskImage']) glass.style[k] = cutout;
  for (const k of ['maskSize', 'webkitMaskSize']) glass.style[k] = `${PHOTO_W}px ${PHOTO_H}px`;
  for (const k of ['maskPosition', 'webkitMaskPosition']) glass.style[k] = `${PHOTO_LEFT}px ${PHOTO_TOP}px`;
  sprites = [];
  for (const name of currentPoses()) {
    const sp = makeSprite(name);
    sp.shades = makeShadow(sp);
    const away = C.poses[name].away;
    // away: 그림자와 몸을 한 층에 묶어 벽 색을 덮고(앱 wallMatrix), 잔 누끼만큼 지워 잔 뒤에 세운다.
    // behindCup(빼꼼): 벽 색 없이 원래 색 그대로 잔 누끼만큼 지우고, 잔 앞 조각(sp.front)은 그 위에 지우지 않고 둔다.
    const host = away ? awayHost(away.fade, cutout) : C.poses[name].behindCup ? cupHost(cutout) : layer;
    if (host !== layer) layer.appendChild(host);
    for (const sh of sp.shades) host.appendChild(sh.el);
    host.appendChild(sp.el);
    if (sp.front) layer.appendChild(sp.front);
    sp.bubbles = makeBubbles(sp);
    for (const el of sp.bubbles ?? []) layer.appendChild(el);
    sprites.push(sp);
  }
  const names = currentPoses().map(k => C.poses[k].label).join(', ');
  document.getElementById('now').textContent = `지금: ${names}${state.pose === 'auto' ? ' (자동)' : ''}`;
  for (const b of document.querySelectorAll('#chars-row button')) b.setAttribute('aria-pressed', String(b.dataset.v === state.char));
  for (const b of document.querySelectorAll('#steps button')) b.setAttribute('aria-pressed', String(Number(b.dataset.v) === state.step));
  const row = document.getElementById('poses');
  row.replaceChildren();
  buttons('poses', [['auto', '자동'], ...Object.entries(C.poses).map(([k, p]) => [k, p.label]), ['all', '전부 겹쳐 보기']], v => { state.pose = v; render(); });
  for (const b of row.querySelectorAll('button')) {
    b.setAttribute('aria-pressed', String(b.dataset.v === state.pose));
    const k = b.dataset.v;
    b.disabled = C.poses[k] ? !allowed(k, state.step) : false;
  }
}

const t0 = performance.now();
function frame(now) {
  const t = state.reduce ? 0 : (now - t0) / 1000;
  for (const sp of sprites) apply(sp, t, !state.reduce);
  drawGlass();
  requestAnimationFrame(frame);
}

function buttons(id, items, onPick) {
  const row = document.getElementById(id);
  for (const [v, label] of items) {
    const b = document.createElement('button');
    b.dataset.v = v; b.textContent = label;
    b.onclick = () => onPick(v);
    row.appendChild(b);
  }
}

// 스크린샷용: ?char=kain&step=80&pose=swim&t=1.2
const q = new URLSearchParams(location.search);
const bundleRig = fetch(`${ASSETS}/idle-rig.json`, { cache: 'no-store' }).then(r => r.json());
const loads = Object.keys(CHARS).map(k => Promise.all([
  fetch(`${CHAR_DIR}/${k}/poses/meta.json`, { cache: 'no-store' }).then(r => r.json()),
  fetch(`${CHAR_DIR}/${k}/parts/parts.json`, { cache: 'no-store' }).then(r => r.json()),
  fetch(`${CHAR_DIR}/${k}/poses.json`, { cache: 'no-store' }).then(r => r.json()),
  bundleRig,
]).then(([meta, parts, book, rig]) => {
  const norm = Object.fromEntries(Object.entries(rig[k]).filter(([art]) => meta[art]).map(([art, a]) => [art, a.canvas[0] / meta[art].canvas[0]]));
  Object.assign(CHARS[k], { meta, parts, norm, zero: book.zero, poses: book.poses });
}));
function useChar(k) {
  state.char = k; C = CHARS[k];
  state.meta = C.meta; state.parts = C.parts;
}
Promise.all(loads).then(() => {
  useChar(q.get('char') ?? 'roshu');
  if (q.has('step')) state.step = Number(q.get('step'));
  if (q.has('pose')) state.pose = q.get('pose');
  state.picked = autoPose(state.step);
  buttons('chars-row', Object.entries(CHARS).map(([k, c]) => [k, c.label]), v => {
    useChar(v);
    state.pose = 'auto';
    state.picked = autoPose(state.step);
    render();
  });
  buttons('steps', STEPS.map(s => [s, `${s}%`]), v => {
    state.step = Number(v);
    state.picked = autoPose(state.step);
    if (C.poses[state.pose] && !allowed(state.pose, state.step)) state.pose = 'auto';
    render();
  });
  document.getElementById('reroll').onclick = () => { state.pose = 'auto'; state.picked = autoPose(state.step); render(); };
  document.getElementById('reduce').onclick = e => { state.reduce = !state.reduce; e.target.setAttribute('aria-pressed', String(state.reduce)); };
  initGlass();
  render();
  if (q.has('t')) {
    state.reduce = true;
    for (const sp of sprites) apply(sp, Number(q.get('t')), false);
    Promise.all([...document.images].map(i => i.decode().catch(() => null)), geo.pending).then(() => {
      drawGlass();
      document.body.dataset.ready = '1';
    });
    return;
  }
  requestAnimationFrame(frame);
  document.body.dataset.ready = '1';
});
</script>
</body>
</html>
