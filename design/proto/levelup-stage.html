<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>슈가캡 · 단계 상승 무대 이벤트 (시안)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* 단계 상승 무대 이벤트 시안(2026-10-11 대표님 지시, SPEC §4.9 결정 4). 좌표는 폰 pt(402×874), 무대를 3배로 키운다.
     ?s=1 → 1배, &z=배율, &t=초 → 그 순간에 멈춤, &side=caffeine → 카인, &stage=<사이 이름>.
     순서: 화면이 어두워짐 → 위에서 연극 조명이 "딱" 떨어짐(깜빡 한 번) → 캐릭터 폴짝 + 팡파레 조각 → 한 줄 → 조명 꺼짐.
     에어브러시 없음(SPEC §5): 조명은 가장자리가 또렷한 단색 반투명 원뿔 + 바닥 타원, 조각은 단색 면. */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; }
  body { width: 1206px; height: 2622px; overflow: hidden; font-family: "Pretendard", sans-serif; color: #18181B; }
  body.s1 { width: 402px; height: 874px; }
  .stage { position: absolute; left: 0; top: 0; width: 402px; height: 874px; overflow: hidden; transform: scale(3); transform-origin: 0 0; background: #F3F5F8; }
  body.s1 .stage { transform: none; }
  .abs { position: absolute; left: 0; top: 0; width: 402px; height: 874px; }
  .photo { position: absolute; left: -5.46px; top: 69.92px; width: 412.92px; height: 734.16px; overflow: hidden;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 96%, transparent 100%); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .topfade { position: absolute; left: 0; top: 0; right: 0; height: 160px; background: linear-gradient(to bottom, rgba(0,0,0,.09), transparent); }
  .kicker { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; color: #18181B; }
  .head { position: absolute; left: 24px; top: 68px; z-index: 2; }
  .hero { display: flex; align-items: baseline; margin-top: 2px; white-space: nowrap; }
  .hero b { font-size: 96px; font-weight: 700; letter-spacing: -5.8px; font-variant-numeric: tabular-nums; line-height: 1.04; }
  .hero span { font-size: 30px; font-weight: 500; opacity: .85; margin-left: 6px; }
  .hero small { font-size: 13px; color: #8E8E93; margin-left: 10px; }
  .corner { position: absolute; top: 63px; width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.22); }
  #btnTrends { left: 287px; } #btnSettings { left: 324px; }
  .closed { position: absolute; left: 20px; top: 780px; padding: 9px 14px; border-radius: 20px; background: rgba(255,255,255,.55); font-size: 13px; font-weight: 500; color: #6E6E73; }
  .dots { position: absolute; left: 0; right: 0; top: 795px; text-align: center; }
  .dots i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #18181B; margin: 0 4px; }
  .dots i + i { background: rgba(24,24,27,.25); }

  .char { position: absolute; transform-origin: 50% 100%; z-index: 1; }
  .shadow { position: absolute; border-radius: 50%; background: rgba(70,56,60,.28); }

  /* 무대: 어둠(조명 모양 구멍) + 조명 색 면 + 조각 + 글자. 캐릭터는 어둠 위로 올리지 않는다(구멍으로 보인다). */
  .fx { pointer-events: none; }
  #dark, #beam { opacity: 0; }
  .bit { position: absolute; left: 0; top: 0; opacity: 0; }
  .line { position: absolute; left: 24px; width: 250px; color: #fff; opacity: 0; }
  .line .k { font-size: 11px; font-weight: 600; letter-spacing: 1.3px; opacity: .7; }
  .line .m { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.25; margin-top: 8px; }
  .touch { position: absolute; left: 0; top: 0; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%;
    background: rgba(255,255,255,.35); border: 2px solid rgba(255,255,255,.9); opacity: 0; }
  .hud { position: fixed; left: 8px; bottom: 8px; z-index: 9; font: 12px/1.4 monospace; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; }
</style>
</head>
<body>
<div class="stage" id="stage">
  <div class="abs" id="today">
    <div class="photo"><img id="cupPhoto" alt=""></div>
    <div class="shadow" id="shadow"></div>
    <img class="char" id="char" alt="">
    <div class="topfade"></div>
    <div class="head">
      <div class="kicker" id="kicker">오늘 남은 당</div>
      <div class="hero"><b id="heroNum">29</b><span id="heroUnit">g</span><small id="heroLimit">/50 g</small></div>
    </div>
    <div class="corner" id="btnTrends"></div>
    <div class="corner" id="btnSettings"></div>
    <div class="closed">☾ 마감함</div>
    <div class="dots"><i></i><i></i></div>
  </div>

  <div class="abs fx" id="fx">
    <svg class="abs" viewBox="0 0 402 874" width="402" height="874">
      <defs>
        <mask id="hole">
          <rect width="402" height="874" fill="#fff"/>
          <path id="holeCone" fill="#000"/>
          <ellipse id="holePool" fill="#000"/>
        </mask>
      </defs>
      <rect id="dark" width="402" height="874" fill="rgba(0,0,0,.66)" mask="url(#hole)"/>
      <g id="beam">
        <path id="cone" fill="rgba(255,248,226,.16)"/>
        <ellipse id="pool" fill="rgba(255,248,226,.30)"/>
      </g>
    </svg>
    <div id="bits"></div>
    <div class="line" id="line" style="top:196px">
      <div class="k">사이</div>
      <div class="m" id="msg">로슈와 기다려지는 사이가 됐어요!</div>
    </div>
    <div class="touch" id="touch"></div>
  </div>
</div>
<div class="hud" id="hud"></div>

<script>
const q = new URLSearchParams(location.search);
const SIDE = q.get('side') === 'caffeine' ? 'caffeine' : 'sugar';
const SEEK = q.has('t') ? parseFloat(q.get('t')) : null;
if (q.get('s') === '1') document.body.classList.add('s1');
if (q.has('z')) { const z = parseFloat(q.get('z')); document.body.style.width = 402 * z + 'px'; document.body.style.height = 874 * z + 'px'; document.getElementById('stage').style.transform = `scale(${z})`; }
const ASSETS = '../../SugarCap/Resources';

const SIDES = {
  sugar: { kicker: '오늘 남은 당', num: '29', unit: 'g', limit: '/50 g', photo: `${ASSETS}/Assets.xcassets/cup-strawberry-latte-50.imageset/50.png`,
    art: `${ASSETS}/Shared.xcassets/character-roshu.imageset/roshu.png`, h: 92, name: '로슈와',
    bits: ['#F6E56A', '#5DA9F0', '#FFFFFF', '#F2A7B8', '#F2CF3F'] },
  caffeine: { kicker: '오늘 남은 카페인', num: '400', unit: 'mg', limit: '/400 mg', photo: `${ASSETS}/Assets.xcassets/cup-iced-americano-100.imageset/100.png`,
    art: `${ASSETS}/Shared.xcassets/character-kain.imageset/kain.png`, h: 78, name: '카인과',
    bits: ['#8FCB96', '#EDE8C9', '#FFFFFF', '#5FA868', '#F2CF3F'] },
};
const S = SIDES[SIDE];
const STAGE_NAME = q.get('stage') || (SIDE === 'sugar' ? '기다려지는 사이' : '친한 사이');
document.getElementById('cupPhoto').src = S.photo;
document.getElementById('kicker').textContent = S.kicker;
document.getElementById('heroNum').textContent = S.num;
document.getElementById('heroUnit').textContent = S.unit;
document.getElementById('heroLimit').textContent = S.limit;
// 조명 밖(왼쪽)에 세 줄: 이름 / 사이 이름 / 됐어요.
document.getElementById('msg').innerHTML = `${S.name}<br>${STAGE_NAME}가<br>됐어요!`;

// 캐릭터: 컵 앞 바닥(사진 칸 발끝 = 높이 0.897).
const footX = 201, footY = 69.92 + 734.16 * 0.897;
const ch = document.getElementById('char');
ch.src = S.art; ch.style.height = S.h + 'px';
ch.onload = () => { ch.style.left = (footX - ch.offsetWidth / 2) + 'px'; };
ch.style.left = (footX - S.h * 0.45) + 'px';
ch.style.top = (footY - S.h) + 'px';
const sh = document.getElementById('shadow');
Object.assign(sh.style, { width: S.h * 0.8 + 'px', height: S.h * 0.1 + 'px', left: (footX - S.h * 0.4) + 'px', top: (footY - S.h * 0.05) + 'px' });

// 조명: 화면 오른쪽 위 밖(꼭짓점)에서 캐릭터 발밑 타원까지 비스듬히. 왼쪽 글자와 겹치지 않는다.
const apex = { x: 432, y: -40 }, apexHalf = 14;
const pool = { cx: footX, cy: footY, rx: S.h * 0.95, ry: S.h * 0.2 };
const conePath = `M${apex.x - apexHalf},${apex.y} L${apex.x + apexHalf},${apex.y} L${pool.cx + pool.rx},${pool.cy} L${pool.cx - pool.rx},${pool.cy} Z`;
for (const id of ['cone', 'holeCone']) document.getElementById(id).setAttribute('d', conePath);
for (const id of ['pool', 'holePool']) {
  const e = document.getElementById(id);
  e.setAttribute('cx', pool.cx); e.setAttribute('cy', pool.cy); e.setAttribute('rx', pool.rx); e.setAttribute('ry', pool.ry);
}

// 팡파레: 캐릭터 양옆 바닥에서 두 번 터지는 단색 조각(폭죽 두 발).
const bitsEl = document.getElementById('bits');
const bits = [];
for (let i = 0; i < 40; i++) {
  const b = document.createElement('div'); b.className = 'bit';
  const kind = i % 4;
  b.style.background = S.bits[i % S.bits.length];
  if (kind === 0) { b.style.width = '6px'; b.style.height = '6px'; b.style.borderRadius = '50%'; }
  else if (kind === 1) { b.style.width = '3px'; b.style.height = '13px'; b.style.borderRadius = '1px'; }   // 띠
  else { b.style.width = (5 + (i % 3)) + 'px'; b.style.height = '8px'; b.style.borderRadius = '1px'; }
  bitsEl.appendChild(b);
  const left = i % 2 === 0;
  const ox = footX + (left ? -S.h * 0.75 : S.h * 0.75), oy = footY - 6;
  const ang = -Math.PI / 2 + (left ? -0.35 : 0.35) + (Math.random() - 0.5) * 0.9;
  const sp = 260 + Math.random() * 170;
  bits.push({ el: b, ox, oy, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, rot: (Math.random() - 0.5) * 1100, at: left ? 0 : 0.12 });
}

const tl = gsap.timeline({ paused: true });
// 0) 어둠
const D0 = 0.4;
tl.to('#dark', { opacity: 1, duration: 0.3, ease: 'power1.out' }, D0);
// 1) 조명 "딱": 켜짐 → 한 번 깜빡 → 켜짐(무대 조명이 들어오는 맛). 서서히 밝아지지 않는다.
const L0 = D0 + 0.45;
tl.set('#beam', { opacity: 1 }, L0);
tl.set('#beam', { opacity: 0.25 }, L0 + 0.07);
tl.set('#beam', { opacity: 1 }, L0 + 0.13);
// 2) 캐릭터 폴짝(눌림 → 점프 → 착지 눌림). 회전 없음(카인 360도 금지 규칙).
const J0 = L0 + 0.35;
tl.to('#char', { scaleX: 1.08, scaleY: 0.9, duration: 0.1 }, J0);
tl.to('#char', { y: -34, scaleX: 0.96, scaleY: 1.06, duration: 0.26, ease: 'power2.out' }, J0 + 0.1);
tl.to('#char', { y: 0, scaleX: 1, scaleY: 1, duration: 0.22, ease: 'power2.in' }, J0 + 0.36);
tl.to('#char', { scaleX: 1.1, scaleY: 0.88, duration: 0.08 }, J0 + 0.58);
tl.to('#char', { scaleX: 1, scaleY: 1, duration: 0.18, ease: 'back.out(2)' }, J0 + 0.66);
tl.to('#shadow', { scale: 0.7, duration: 0.26, ease: 'power2.out', yoyo: true, repeat: 1 }, J0 + 0.1);
// 3) 팡파레(점프 꼭대기에서)
const F0 = J0 + 0.3;
for (const b of bits) {
  const p = { t: 0 };
  tl.set(b.el, { left: b.ox, top: b.oy, opacity: 1, rotation: 0, x: 0, y: 0 }, F0 + b.at);
  tl.to(p, { t: 1, duration: 1.5, ease: 'none', onUpdate() {
    const t = p.t * 1.5;
    gsap.set(b.el, { x: b.vx * t * (1 - 0.25 * t), y: b.vy * t + 0.5 * 560 * t * t, rotation: b.rot * t,
      opacity: t < 1.15 ? 1 : Math.max(0, 1 - (t - 1.15) / 0.35) });
  } }, F0 + b.at);
}
// 4) 한 줄
const T0 = F0 + 0.15;
tl.fromTo('#line', { opacity: 0, y: -16 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power3.out' }, T0);
// 5) 끝: 조명 "딱" 꺼짐 → 어둠 걷힘
const E0 = T0 + 2.0;
tl.to('#line', { opacity: 0, duration: 0.2 }, E0 - 0.1);
tl.set('#beam', { opacity: 0 }, E0);
tl.to('#dark', { opacity: 0, duration: 0.3 }, E0 + 0.05);

const hud = document.getElementById('hud');
if (SEEK !== null) { tl.pause(0); tl.seek(SEEK, false); hud.textContent = `t=${SEEK.toFixed(2)}s side=${SIDE}`; }
else { tl.play(); tl.eventCallback('onUpdate', () => hud.textContent = `t=${tl.time().toFixed(2)}s side=${SIDE} (총 ${tl.duration().toFixed(1)}s)`); }
window.addEventListener('keydown', e => { if (e.key === ' ') tl.paused(!tl.paused()); if (e.key === 'r') tl.restart(); });
</script>
</body>
</html>
