<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>슈가캡 · 스탬프판 반복 (시안)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  /* 스탬프판 반복 시안(Phase 4b, 대표님 2026-11-27). 좌표는 폰 pt(402×874). 판 모양은 stamp-card.html 그대로.
     다 찬 판은 뒤로 넘어가 아래 가장자리가 엇갈려 보인다. 가장자리를 잡아 끌거나 누르면 뒤 판이 앞으로 온다.
     ?state=full|turn|mid|third, &rm=1(동작 줄이기), &z=배율. 에어브러시 없음: 단색 면·또렷한 선만. */
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #E4E4E7; font-family: "Pretendard", sans-serif; color: #18181B; }
  body { display: flex; gap: 32px; padding: 32px; align-items: flex-start; }
  .frame { width: 402px; height: 874px; position: relative; flex: none; transform-origin: 0 0; }
  .stage { position: absolute; inset: 0; overflow: hidden; border-radius: 44px; background: #F4F4F5; }
  .bg { position: absolute; left: -5px; top: 70px; width: 413px; height: 734px; object-fit: cover; }
  .hero { position: absolute; left: 24px; top: 70px; display: flex; align-items: baseline; }
  .hero b { font-size: 96px; font-weight: 700; letter-spacing: -5.8px; font-variant-numeric: tabular-nums; line-height: 1.04; }
  .hero span { font-size: 30px; font-weight: 500; opacity: .85; margin-left: 6px; }
  .dim { position: absolute; inset: 0; background: rgba(0,0,0,.5); }

  .deck { position: absolute; left: 24px; right: 24px; top: 236px; }
  .card { position: absolute; left: 0; right: 0; top: 0; background: #fff; border-radius: 16px; transform-origin: 50% 100%;
    --py: 76px;
    -webkit-mask: radial-gradient(circle 9px at 0 var(--py), #0000 8.5px, #000 9px), radial-gradient(circle 9px at 100% var(--py), #0000 8.5px, #000 9px);
    -webkit-mask-composite: source-in; mask-composite: intersect; }
  .card .top { padding: 22px 22px 18px; display: flex; align-items: baseline; justify-content: space-between; }
  .card h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.3px; }
  .card h2 em { font-style: normal; font-size: 17px; font-weight: 600; color: #A1A1AA; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .count { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; margin-right: 34px; }
  .count small { font-size: 15px; font-weight: 500; color: #A1A1AA; }
  .x { position: absolute; right: 14px; top: 16px; width: 30px; height: 30px; border-radius: 50%; background: #F4F4F5; display: grid; place-items: center; }
  .x svg { width: 11px; height: 11px; }
  .perf { position: relative; height: 18px; }
  .perf i { position: absolute; left: 16px; right: 16px; top: 8.5px; border-top: 1.5px dashed #D4D4D8; }
  .grid { padding: 14px 18px 6px; display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 14px; justify-items: center; }
  .cell { position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid #D4D4D8; display: grid; place-items: center; }
  .cell > .n, .cell > svg { grid-area: 1 / 1; }
  .cell .n { font-size: 12px; font-weight: 600; color: #A1A1AA; font-variant-numeric: tabular-nums; }
  .cell.today { border: 2px solid #18181B; }
  .cell.today .n { color: #18181B; }
  .cell.done { border-color: #18181B; background: #18181B; }
  .cell.done .n { display: none; }
  .cell .ink { position: absolute; inset: -1.5px; border-radius: 50%; background: #18181B; opacity: 0; }
  .cell svg.prize { position: relative; width: 24px; height: 24px; opacity: 0; }
  .cell.done svg.prize { opacity: 1; }
  .cell.last { border-style: dashed; border-color: #18181B; }
  .cell.last svg.cupmark { width: 18px; height: 18px; }
  .cell.last.done { background: #fff; border: 2px solid #18181B; }
  .cell.last.done .won { width: 34px; height: 34px; border-radius: 50%; background-size: 26px 46px; background-position: 4px -9px; background-repeat: no-repeat; }
  .note { padding: 14px 22px 22px; font-size: 14px; font-weight: 500; color: #71717A; text-align: center; }
  /* 뒤 판 가장자리를 잡는 자리(44pt). 판 아래 끝에 걸쳐 있다. */
  .grab { position: absolute; left: 0; right: 0; height: 44px; cursor: grab; touch-action: none; }
  .grab:active { cursor: grabbing; }

  .panel { width: 280px; font-size: 13px; line-height: 1.6; color: #3F3F46; }
  .panel h1 { font-size: 16px; margin-bottom: 10px; }
  .panel button { display: block; width: 100%; margin: 6px 0; padding: 9px 12px; border: 1px solid #D4D4D8; background: #fff; border-radius: 8px; font: 500 13px "Pretendard"; text-align: left; cursor: pointer; }
  .panel button.on { border-color: #18181B; font-weight: 700; }
  .panel p { margin-top: 14px; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="stage">
    <img class="bg" src="stamp-img/bg.png" alt="">
    <div class="hero"><b>20</b><span>g</span></div>
    <div class="dim"></div>
    <div class="deck" id="deck"></div>
  </div>
</div>

<div class="panel">
  <h1>상태</h1>
  <button data-s="full">1판 다 참 (14칸, 다음 마감 전)</button>
  <button data-s="turn">15칸 마감 → 판 바뀜</button>
  <button data-s="mid">2판 중간 (20칸, 뒤에 1판)</button>
  <button data-s="third">3판 시작 (29칸, 뒤에 2장)</button>
  <h1 style="margin-top:18px">동작</h1>
  <button id="replay">판 바뀜 다시 보기</button>
  <button id="rm">동작 줄이기: 끔</button>
  <p>다 찬 판은 뒤로 넘어가고, 지금 판 아래로 가장자리가 10pt씩 엇갈려 보인다(최대 2장).<br>
     그 가장자리를 아래로 끌면 뒤 판이 손을 따라 나오고, 충분히 끌거나 누르면 앞으로 온다. 덜 끌고 놓으면 제자리로 돌아간다.<br>
     앞에 온 판은 맨 뒤로 간다. 계속 넘기면 지금 판으로 돌아온다.</p>
</div>

<script>
const q = new URLSearchParams(location.search);
const z = parseFloat(q.get("z") || "1");
const frameEl = document.getElementById("frame");
frameEl.style.transform = `scale(${z})`;
if (z !== 1) { frameEl.style.marginRight = `${402 * (z - 1)}px`; frameEl.style.marginBottom = `${874 * (z - 1)}px`; }
let reduceMotion = q.get("rm") === "1";

function rng(seed) { return () => { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }; }
function rollPrizes(seed) {
  const r = rng(seed);
  const caps = r() < 0.5 ? 1 : 2;
  const list = Array.from({ length: 13 }, (_, i) => ({ kind: i < caps ? "cap" : "heart", side: r() < 0.5 ? "roshu" : "kain" }));
  for (let i = list.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [list[i], list[j]] = [list[j], list[i]]; }
  return list;
}
const fill = s => s === "roshu" ? "#FFFFFF" : "#E3C29F";
const heart = s => `<svg class="prize" viewBox="0 0 24 24"><path d="M12 20.5C6 16.3 2.6 13 2.6 8.9 2.6 6.2 4.7 4.2 7.2 4.2c1.9 0 3.6 1.1 4.8 2.8 1.2-1.7 2.9-2.8 4.8-2.8 2.5 0 4.6 2 4.6 4.7 0 4.1-3.4 7.4-9.4 11.6z" fill="${fill(s)}" stroke="${s === "roshu" ? "#52525B" : "none"}" stroke-width="1.2"/></svg>`;
function sealPath() {
  let d = ""; const n = 12;
  for (let i = 0; i <= n * 2; i++) {
    const a = Math.PI * i / n - Math.PI / 2, r = i % 2 ? 9.2 : 10.6;
    d += (i ? "L" : "M") + (12 + r * Math.cos(a)).toFixed(2) + " " + (12 + r * Math.sin(a)).toFixed(2);
  }
  return d + "Z";
}
const cap = s => `<svg class="prize" viewBox="0 0 24 24"><path d="${sealPath()}" fill="${fill(s)}" stroke="${s === "roshu" ? "#52525B" : "none"}" stroke-width="1.1" stroke-linejoin="round"/><circle cx="12" cy="12" r="5.6" fill="none" stroke="${s === "roshu" ? "#D4D4D8" : "#C9A57E"}" stroke-width="1.2"/></svg>`;
const cupMark = `<svg class="cupmark" viewBox="0 0 20 20" fill="none" stroke="#18181B" stroke-width="1.6" stroke-linejoin="round"><path d="M4.5 5h11l-1.4 11.2a1.5 1.5 0 0 1-1.5 1.3H7.4a1.5 1.5 0 0 1-1.5-1.3z"/><path d="M5 9.5h10"/></svg>`;
const xMark = `<div class="x"><svg viewBox="0 0 12 12" stroke="#18181B" stroke-width="1.8" stroke-linecap="round"><path d="M1.5 1.5l9 9M10.5 1.5l-9 9"/></svg></div>`;
const wonSet = { 1: "grape", 2: "mango", 3: "matcha" };

// 판 하나. n = 판 번호, s = 그 판에서 찍은 칸 수(0~14).
function boardEl(n, s) {
  const el = document.createElement("div");
  el.className = "card";
  const prizes = rollPrizes(20261105 + n * 7919);
  let cells = "";
  for (let i = 0; i < 14; i++) {
    if (i === 13) {
      cells += s === 14
        ? `<div class="cell last done"><div class="won" style="background-image:url(stamp-img/${wonSet[n]}.png)"></div></div>`
        : `<div class="cell last">${cupMark}</div>`;
    } else {
      const p = prizes[i];
      const cls = i < s ? " done" : i === s ? " today" : "";
      cells += `<div class="cell${cls}"><div class="ink"></div><span class="n">${i + 1}</span>${p.kind === "cap" ? cap(p.side) : heart(p.side)}</div>`;
    }
  }
  el.innerHTML = `<div class="top"><h2>2주 스탬프<em>${n}판</em></h2><div class="count"><span class="cnt">${s}</span> <small>/ 14</small></div></div>
    ${xMark}<div class="perf"><i></i></div><div class="grid">${cells}</div>
    <div class="note">밤에 돌아와서 마감 시 스탬프를 적립!</div>`;
  return el;
}

const deck = document.getElementById("deck");
let els = [];   // 판 번호 순서(1판부터)
let order = []; // 앞에서부터 els 인덱스. order[0]이 앞 판
let grab = null;

// 뒤 판 자리: 10pt씩 아래로, 3.5%씩 작게, 번갈아 살짝 기울여 엇갈리게. 3장째부터는 2장째 뒤에 숨긴다.
function pose(k) {
  if (k === 0) return { y: 0, scale: 1, rotation: 0, backgroundColor: "#FFFFFF", opacity: 1 };
  const d = Math.min(k, 2);
  return { y: 10 * d, scale: 1 - 0.035 * d, rotation: d === 1 ? -1.4 : 1.1, backgroundColor: d === 1 ? "#E4E4E7" : "#D4D4D8", opacity: k > 2 ? 0 : 1 };
}
function place(animate) {
  order.forEach((bi, k) => {
    const el = els[bi];
    el.style.zIndex = 100 - k;
    el.style.pointerEvents = k === 0 ? "auto" : "none";
    if (animate) gsap.to(el, { ...pose(k), duration: reduceMotion ? .2 : .38, ease: "expo.out" });
    else gsap.set(el, pose(k));
  });
  placeGrab();
}
function placeGrab() {
  if (!grab) { grab = document.createElement("div"); grab.className = "grab"; deck.appendChild(grab); bindGrab(); }
  const h = els[order[0]].offsetHeight;
  grab.style.top = `${h - 8}px`;
  grab.style.zIndex = 300;
  grab.style.display = order.length > 1 ? "block" : "none";
}

function build(boards) {
  deck.innerHTML = ""; grab = null;
  els = boards.map(([n, s]) => { const el = boardEl(n, s); deck.appendChild(el); return el; });
  order = els.map((_, i) => i).reverse(); // 마지막(지금) 판이 앞
  place(false);
}

// 가장자리 잡기: 뒤 판(order[1])이 손을 따라 아래로 나온다. 120pt를 넘으면 고무줄처럼 덜 따라온다.
function bindGrab() {
  let startY = 0, dy = 0, lastY = 0, lastT = 0, v = 0, active = false, el = null;
  grab.addEventListener("pointerdown", e => {
    if (order.length < 2) return;
    active = true; el = els[order[1]]; gsap.killTweensOf(el);
    startY = lastY = e.clientY / z; lastT = performance.now(); dy = 0; v = 0;
    grab.setPointerCapture(e.pointerId);
  });
  grab.addEventListener("pointermove", e => {
    if (!active) return;
    const y = e.clientY / z, t = performance.now();
    v = (y - lastY) / Math.max(t - lastT, 1); lastY = y; lastT = t;
    dy = Math.max(0, y - startY);
    const eff = dy < 120 ? dy : 120 + (dy - 120) * 0.35;
    const p = pose(1);
    gsap.set(el, { y: p.y + eff, rotation: p.rotation * (1 - Math.min(eff / 120, 1)) });
  });
  const end = () => {
    if (!active) return;
    active = false;
    const projected = dy + v * 180; // 놓을 때 속도로 내다본 거리
    if (dy < 4 || projected > 90) bringForward();
    else gsap.to(el, { ...pose(1), duration: .45, ease: "back.out(1.6)" });
  };
  grab.addEventListener("pointerup", end);
  grab.addEventListener("pointercancel", end);
}
// 뒤 판을 앞으로: 아래로 마저 빠져나온 뒤 앞 판 위로 올라선다. 앞에 있던 판은 맨 뒤로 간다.
function bringForward() {
  const pulled = order[1], front = order[0], el = els[pulled];
  const h = els[front].offsetHeight;
  const rest = order.filter(i => i !== pulled && i !== front);
  if (reduceMotion) {
    order = [pulled, ...rest, front];
    gsap.set(el, { opacity: 0 }); place(false); gsap.to(el, { opacity: 1, duration: .2 });
    return;
  }
  gsap.timeline()
    .to(el, { y: h * 0.62, rotation: 0, scale: .98, duration: .18, ease: "power2.out" })
    .add(() => { el.style.zIndex = 200; })
    .add(() => {
      order = [pulled, ...rest, front];
      order.forEach((bi, k) => { els[bi].style.pointerEvents = k === 0 ? "auto" : "none"; });
      gsap.to(el, { ...pose(0), duration: .34, ease: "expo.out", onComplete: () => place(false) });
      order.slice(1).forEach((bi, k) => gsap.to(els[bi], { ...pose(k + 1), duration: .34, ease: "expo.out" }));
      placeGrab();
    });
}

// 판 바뀜(15칸 마감): 다 찬 1판이 살짝 들렸다가 뒤로 내려앉고, 새 판이 위에서 내려와 자리 잡은 뒤 1칸이 찍힌다.
function turn() {
  build([[1, 14]]);
  const old = els[0];
  const fresh = boardEl(2, 0);
  deck.appendChild(fresh);
  els.push(fresh);
  fresh.style.zIndex = 200;
  if (reduceMotion) {
    gsap.set(fresh, { ...pose(0), opacity: 0 });
    gsap.timeline({ delay: .5 })
      .to(old, { ...pose(1), duration: .2 })
      .to(fresh, { opacity: 1, duration: .2 }, "<")
      .add(() => { order = [1, 0]; place(false); stampFirst(fresh); }, "+=.2");
    return;
  }
  gsap.set(fresh, { y: -28, scale: .96, rotation: 0, opacity: 0, backgroundColor: "#FFFFFF" });
  gsap.timeline({ delay: .6 })
    .to(old, { y: -6, scale: 1.015, duration: .16, ease: "power2.out" })
    .to(old, { ...pose(1), duration: .42, ease: "power3.inOut" })
    .to(fresh, { y: 0, scale: 1, duration: .4, ease: "expo.out" }, "-=.12")
    .to(fresh, { opacity: 1, duration: .12, ease: "none" }, "<")
    .add(() => { order = [1, 0]; place(false); }, "+=.05")
    .add(() => stampFirst(fresh), "+=.25");
}
// 새 판 1칸 찍기(stamp-card.html 찍기와 같은 동작).
function stampFirst(board) {
  const cell = board.querySelector(".cell");
  const ink = cell.querySelector(".ink"), prize = cell.querySelector(".prize"), n = cell.querySelector(".n");
  const cnt = board.querySelector(".cnt");
  if (reduceMotion) { cell.classList.add("done"); cell.classList.remove("today"); cnt.textContent = 1; return; }
  gsap.timeline({ onComplete: () => { cell.classList.add("done"); cell.classList.remove("today"); } })
    .set(ink, { opacity: 0, scale: 1.7, rotation: -10 })
    .to(n, { opacity: 0, duration: .1 }, 0)
    .to(ink, { opacity: 1, scale: 1, rotation: 0, duration: .22, ease: "power3.in" }, .05)
    .to(cell, { scale: .9, duration: .06, yoyo: true, repeat: 1, ease: "power1.out" }, .27)
    .fromTo(prize, { opacity: 0, scale: .3 }, { opacity: 1, scale: 1, duration: .32, ease: "back.out(2.4)" }, .33)
    .add(() => { cnt.textContent = 1; }, .33)
    .fromTo(cnt, { y: -6 }, { y: 0, duration: .25, ease: "expo.out" }, .33);
}

let current = "full";
function setState(s) {
  current = s;
  document.querySelectorAll("[data-s]").forEach(b => b.classList.toggle("on", b.dataset.s === s));
  if (s === "full") build([[1, 14]]);
  else if (s === "turn") turn();
  else if (s === "mid") build([[1, 14], [2, 6]]);
  else build([[1, 14], [2, 14], [3, 1]]);
}
document.querySelectorAll("[data-s]").forEach(b => b.onclick = () => setState(b.dataset.s));
document.getElementById("replay").onclick = () => setState("turn");
const rmButton = document.getElementById("rm");
const syncRm = () => { rmButton.textContent = `동작 줄이기: ${reduceMotion ? "켬" : "끔"}`; };
rmButton.onclick = () => { reduceMotion = !reduceMotion; syncRm(); setState(current); };
syncRm();
setState(q.get("state") || "full");
</script>
</body>
</html>
