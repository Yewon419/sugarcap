<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SugarCap Large widget proto v2</title>
<!-- 리포 루트에서 `py -m http.server` 후 /design/proto/widget-large.html.
     v2(대표님 2026-11-09 v1 "너무 구림"): 회색 타일·검은 + 버튼 목록을 버리고 앱 그림(잔 사진·Anton 숫자·메뉴 물결 원 LiquidBadge)으로만 짠다. -->
<style>
  @font-face { font-family: Anton; src: url(../../SugarCap/Resources/Fonts/Anton-Regular.ttf); }
  @font-face { font-family: Pretendard; font-weight: 500; src: url(../../SugarCap/Resources/Fonts/Pretendard-Medium.otf); }
  @font-face { font-family: Pretendard; font-weight: 600; src: url(../../SugarCap/Resources/Fonts/Pretendard-SemiBold.otf); }
  :root { --ink: #1D1D1F; --sub: rgba(29,29,31,0.5); --floor: #EEF0F3; }
  body { margin: 0; font-family: Pretendard, sans-serif; background: #e9e9ec; color: var(--ink); }
  .board { display: flex; flex-direction: column; gap: 26px; padding: 28px 32px; width: max-content; }
  .cap { font-size: 13px; font-weight: 600; margin: 0 0 8px; }
  .row { display: flex; gap: 26px; align-items: flex-start; }
  .w { position: relative; overflow: hidden; border-radius: 22px; background: var(--floor); flex: none; width: 338px; height: 354px; }
  .cell { position: absolute; top: 0; overflow: hidden; }
  .cell img { position: absolute; }
  .n { position: absolute; font-family: Anton; white-space: nowrap; line-height: 1.5054; transform: translateX(-50%); }
  .u { position: absolute; left: 100%; font-family: Anton; white-space: nowrap; line-height: 1.5054; }
  /* A: 음료 선반 */
  .shelf { position: absolute; left: 10px; right: 10px; bottom: 12px; display: grid; grid-template-columns: repeat(4, 1fr); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .item .name { font-size: 11px; font-weight: 600; line-height: 1.25; text-align: center; white-space: nowrap; height: 2.5em; }
  .item.done .name { color: var(--ink); }
  /* B: 메뉴판 */
  .menu { position: absolute; left: 14px; right: 14px; top: 166px; bottom: 10px; display: flex; flex-direction: column; }
  .line { flex: 1; display: flex; align-items: center; gap: 10px; min-width: 0; }
  .line + .line { border-top: 1px solid rgba(29,29,31,0.07); }
  .line .txt { flex: 1; min-width: 0; }
  .line .name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .line .meta { font-size: 11px; font-weight: 500; color: var(--sub); margin-top: 1px; }
  .amt { display: flex; gap: 8px; align-items: baseline; font-family: Anton; font-size: 20px; line-height: 1; flex: none; }
  .amt small { font-size: 0.42em; margin-left: 1px; vertical-align: top; position: relative; top: 0.12em; }
  .line.done .amt, .line.done .meta { display: none; }
  .undo { display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; flex: none; }
  .empty { position: absolute; left: 0; right: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--sub); }
</style>
</head>
<body>
<div class="board" id="b"></div>
<script>
const A = 2409 / 2048, D = 674 / 2048, LIFT = (1 - A - D) / 2 + D;
const PHOTO = 'widget-img/wide-';
const PHOTO_W = 1024, AXIS_X = 512, GLASS_BOTTOM = 975;
const INK = { 'strawberry-latte': { ink: '#B8394A', zero: '#B8394A' }, 'iced-americano': { ink: '#FFFFFF', zero: '#4A3226' } };
const SIDE = { 'strawberry-latte': 'sugar', 'iced-americano': 'caffeine' };
const LIMIT = { sugar: 50, caffeine: 400 };
function step(rem, limit) { const r = rem / limit; return r <= 0 ? 0 : r >= 1 ? 100 : r < 0.5 ? 30 : r < 0.8 ? 50 : 80; }
function luminance(hex) { const v = parseInt(hex.slice(1), 16); return (0.2126 * ((v >> 16) & 255) + 0.7152 * ((v >> 8) & 255) + 0.0722 * (v & 255)) / 255; }

// 실제 카탈로그 값과 색(스타벅스 Tall 355ml).
const DRINKS = [
  { name: '아이스 카페 아메리카노', size: 'Tall', sugar: 0, caf: 150, color: '#4A2C1D' },
  { name: '자몽 허니 블랙 티', size: 'Tall', sugar: 30, caf: 70, color: '#F06B5B' },
  { name: '바닐라 크림 콜드 브루', size: 'Tall', sugar: 10, caf: 135, color: '#4A2C1D' },
  { name: '아이스 바닐라 라떼', size: 'Tall', sugar: 19, caf: 75, color: '#C49A6C' },
];

// 앱 메뉴 썸네일 LiquidBadge와 같은 그림: 원 안에 물결 윗면 액체 두 겹(뒤 45%, 앞 불투명), 옅은 테두리.
function badge(color, size) {
  const wave = (level, amp, phase) => {
    const s = size, surf = s - s * level, h = s * amp, wl = s / 1.5;
    let d = `M0 ${s}`;
    for (let x = 0; x <= s; x += 1) d += ` L${x} ${(surf + h * Math.sin(x / wl * 2 * Math.PI + phase)).toFixed(2)}`;
    return d + ` L${s} ${s} Z`;
  };
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><defs><clipPath id="c${size}"><circle cx="${size / 2}" cy="${size / 2}" r="${size / 2}"/></clipPath></defs>
    <g clip-path="url(#c${size})"><rect width="${size}" height="${size}" fill="#E4E4E8"/>
    <path d="${wave(0.62, 0.045, 1.9)}" fill="${color}" fill-opacity="0.45"/><path d="${wave(0.66, 0.04, 0)}" fill="${color}"/></g>
    <circle cx="${size / 2}" cy="${size / 2}" r="${size / 2 - 0.5}" fill="none" stroke="rgba(0,0,0,0.08)"/></svg>`;
}
const UNDO = '<svg width="13" height="13" viewBox="0 0 13 13"><path d="M4.6 2.2L1.8 5l2.8 2.8M2 5h5.6a3.4 3.4 0 010 6.8H5.4" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function undoBadge(size) {
  return `<div style="width:${size}px;height:${size}px;border-radius:50%;background:#1D1D1F;color:#fff;display:grid;place-items:center">${UNDO.replace('width="13" height="13"', 'width="18" height="18"')}</div>`;
}

// 잔 한 칸: 사진 단위 칸(x0, y0, 폭 w, 높이 h)을 칸(cw x ch pt)에 깐다. 두 잔은 같은 y0·h라 입구 높이가 같다.
function cup(set, rem, cw, ch, y0, h, numSize, axisPt) {
  const side = SIDE[set], st = step(rem, LIMIT[side]), k = ch / h;
  const d = document.createElement('div'); d.className = 'cell'; d.style.width = cw + 'px'; d.style.height = ch + 'px';
  const x0 = AXIS_X - axisPt / k;
  const im = new Image(); im.src = `${PHOTO}${set}-${st}.jpg`;
  Object.assign(im.style, { width: PHOTO_W * k + 'px', left: -x0 * k + 'px', top: -y0 * k + 'px' });
  d.appendChild(im);
  // 숫자 아래 끝 = 잔 바닥 위 6pt(칸 밖이면 칸 아래 4pt), 위젯 Medium과 같은 규칙.
  const glassBottom = (GLASS_BOTTOM - y0) * k;
  const nb = Math.max(4, ch - glassBottom + 6);
  const top = ch - nb - LIFT * numSize - A * numSize;
  const col = st === 0 ? INK[set].zero : INK[set].ink;
  const outline = luminance(col) > 0.5 ? INK[set].zero : '#FFFFFF';
  const R = 1.5, sh = [[1, 0], [-1, 0], [0, 1], [0, -1], [0.71, 0.71], [-0.71, 0.71], [0.71, -0.71], [-0.71, -0.71]].map(([x, y]) => `${x * R}px ${y * R}px 0 ${outline}`).join(',');
  const n = document.createElement('div'); n.className = 'n'; n.style.fontSize = numSize + 'px'; n.style.color = col; n.textContent = Math.round(rem);
  n.style.top = top + 'px'; n.style.left = axisPt + 'px'; n.style.textShadow = sh;
  const u = document.createElement('div'); u.className = 'u'; u.style.fontSize = numSize * 0.32 + 'px'; u.style.top = 0.1975 * numSize + 'px'; u.style.marginLeft = 0.02 * numSize + 'px';
  u.style.color = col; u.style.textShadow = sh; u.textContent = side === 'sugar' ? 'g' : 'mg';
  n.appendChild(u); d.appendChild(n); return d;
}

// 두 잔 나란히(cw = 칸 하나 폭). 가운데 24pt를 섞고, 아래 끝 fade pt를 바닥색으로 녹인다.
function pair(sugar, caf, ch, y0, h, numSize, fade) {
  const t = document.createElement('div'); t.style.cssText = `position:absolute;left:0;top:0;width:338px;height:${ch}px;overflow:hidden`;
  const half = 181;
  t.appendChild(cup('strawberry-latte', sugar, half, ch, y0, h, numSize, 84.5));
  const r = cup('iced-americano', caf, half, ch, y0, h, numSize, 96.5); r.style.left = (338 - half) + 'px';
  r.style.webkitMaskImage = 'linear-gradient(to right, transparent 0px, black 24px)'; t.appendChild(r);
  if (fade) t.style.webkitMaskImage = `linear-gradient(to bottom, black ${ch - fade}px, transparent ${ch}px)`;
  return t;
}

// 선반 이름 줄바꿈(대표님 2026-11-09 "줄바꿈만 좀 신경써줘"). 위젯 Swift가 같은 규칙을 쓴다:
// 1) 한 줄에 들어가면 한 줄. 2) 아니면 띄어쓰기 자리 중 두 줄 중 긴 쪽이 가장 짧은 곳에서 끊는다(외톨이 단어 방지).
// 3) 둘째 줄이 넘치면 끝을 "…"로 줄인다. 4) 칸보다 긴 한 단어는 글자 단위로 끊는다.
const NAME_W = 74;
const ctx = document.createElement('canvas').getContext('2d');
const measure = s => { ctx.font = '600 11px Pretendard'; return ctx.measureText(s).width; };
function ellipsize(s) {
  if (measure(s) <= NAME_W) return s;
  let t = s;
  while (t.length > 1 && measure(t + '…') > NAME_W) t = t.slice(0, -1);
  return t.trimEnd() + '…';
}
function wrapName(name) {
  if (measure(name) <= NAME_W) return [name];
  const words = name.split(' ');
  let best = null;
  for (let i = 1; i < words.length; i++) {
    const a = words.slice(0, i).join(' '), b = words.slice(i).join(' ');
    if (measure(a) > NAME_W) break;
    const cost = measure(b) <= NAME_W ? Math.max(measure(a), measure(b)) : 1000 + measure(b) - measure(a);
    if (!best || cost < best.cost) best = { cost, a, b };
  }
  if (!best) {
    // 첫 단어부터 칸을 넘는다: 글자 단위로 칸에 들어가는 만큼 첫 줄에.
    let n = name.length;
    while (n > 1 && measure(name.slice(0, n)) > NAME_W) n--;
    return [name.slice(0, n), ellipsize(name.slice(n).trimStart())];
  }
  return [best.a, ellipsize(best.b)];
}

function shelf(done, drinks = DRINKS) {
  const s = document.createElement('div'); s.className = 'shelf';
  drinks.forEach((d, i) => {
    const it = document.createElement('div'); it.className = 'item' + (i === done ? ' done' : '');
    it.innerHTML = i === done ? `${undoBadge(50)}<div class="name">되돌리기</div>` : `${badge(d.color, 50)}<div class="name">${wrapName(d.name).join('<br>')}</div>`;
    s.appendChild(it);
  });
  return s;
}

function menu(done) {
  const m = document.createElement('div'); m.className = 'menu';
  DRINKS.forEach((d, i) => {
    const l = document.createElement('div'); l.className = 'line' + (i === done ? ' done' : '');
    const amt = `<div class="amt"><span style="color:#B8394A">${d.sugar}<small>g</small></span><span style="color:#4A3226">${d.caf}<small>mg</small></span></div>`;
    l.innerHTML = i === done
      ? `${undoBadge(30)}<div class="txt"><div class="name">${d.name}</div></div><div class="undo">${UNDO}되돌리기</div>`
      : `${badge(d.color, 30)}<div class="txt"><div class="name">${d.name}</div><div class="meta">스타벅스 ${d.size}</div></div>${amt}`;
    m.appendChild(l);
  });
  return m;
}

function empty(top, height) {
  const e = document.createElement('div'); e.className = 'empty'; e.style.top = top + 'px'; e.style.height = height + 'px';
  e.textContent = '기록한 음료가 여기 떠요'; return e;
}

// A: 잔 전체(입구 위 여유 ~ 냅킨 끝, 사진 단위 y 240~1080)를 위 250pt에, 아래 선반 104pt.
function widgetA(sugar, caf, done, isEmpty, drinks) {
  const w = document.createElement('div'); w.className = 'w';
  w.appendChild(pair(sugar, caf, 262, 240, 840, 46, 28));
  w.appendChild(isEmpty ? empty(262, 80) : shelf(done, drinks));
  return w;
}

// B: 위 158pt는 Medium 두 잔과 같은 확대(사진 단위 높이 392.7), 같은 위끝(덜 찬 잔 기준).
function widgetB(sugar, caf, done, isEmpty, y0) {
  const w = document.createElement('div'); w.className = 'w'; w.style.background = '#fff';
  w.appendChild(pair(sugar, caf, 158, y0, 392.7, 52, 0));
  w.appendChild(isEmpty ? empty(158, 196) : menu(done));
  return w;
}

function cell(caption, widgets) {
  const box = document.createElement('div');
  const c = document.createElement('p'); c.className = 'cap'; c.textContent = caption; box.appendChild(c);
  const r = document.createElement('div'); r.className = 'row'; widgets.forEach(x => r.appendChild(x)); box.appendChild(r);
  document.getElementById('b').appendChild(box);
}

// 남은 양: 당 41 g, 카페인 330 mg. 아메리카노를 누르면 카페인 330 → 180 mg.
// B의 위끝은 위젯 Medium 표(WidgetCupCrops.halfCropY)에서 두 잔 중 큰 값: 80%·80% → 아메리카노 80 기준, 80%·30% → 아메리카노 30 기준.
// 이름 폭은 글꼴이 로드된 뒤에 잰다.
document.fonts.load('600 11px Pretendard').then(() => {
cell('A · 잔 전체 + 음료 선반 · 기본 / 누른 직후(약 10초) / 기록 없음', [
  widgetA(41, 330, -1, false), widgetA(41, 180, 0, false), widgetA(50, 400, -1, true),
]);
// 줄바꿈 확인: 카탈로그에서 이름이 가장 긴 축(메가·컴포즈)과 짧은 이름.
const LONG = [
  { name: '빅포즈 디카페인 제로슈가 제로칼로리 아이스티', color: '#DCE8EE' },
  { name: '나 혼자만 드랍 UP! 은랑 큐브 레몬에이드', color: '#F3D34A' },
  { name: '레몬차', color: '#F3D34A' },
  { name: 'ARIH 포스트바이오틱에너지 드링크 트로피칼웨이브', color: '#E3C93C' },
];
const LONG2 = [
  { name: '음, 괜찮은 휴식이군 블레이드 초코크림커피', color: '#6B3E26' },
  { name: '자몽 허니 블랙 티', color: '#F06B5B' },
  { name: '딸기 라떼', color: '#E8A0A8' },
  { name: 'ARIH 듀얼바이오틱 소다레드 루비 갈로어', color: '#DCE8EE' },
];
cell('A · 줄바꿈 확인(긴 이름)', [widgetA(41, 330, -1, false, LONG), widgetA(41, 330, -1, false, LONG2)]);
cell('B · 메뉴판 · 기본 / 누른 직후(약 10초) / 기록 없음', [
  widgetB(41, 330, -1, false, 263.05), widgetB(41, 180, 0, false, 551.91), widgetB(50, 400, -1, true, 240.83),
]);
});
</script>
</body>
</html>
