<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>슈가캡 · 마실 때마다 줄어드는 컵</title>
<meta name="description" content="당과 카페인을 줄이는 기록 앱. 밤에 남은 만큼을 로슈와 카인에게 먹여요.">
<meta name="theme-color" content="#F7F8FA">
<link rel="preload" href="/assets/fonts/pretendard-800.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/assets/fonts/archivo-black.woff" as="font" type="font/woff" crossorigin>
<link rel="preload" href="/assets/cups/latte-100.webp" as="image">
<style>
  @font-face { font-family: "Pretendard"; font-weight: 500; font-display: swap; src: url("/assets/fonts/pretendard-500.woff") format("woff"); }
  @font-face { font-family: "Pretendard"; font-weight: 700; font-display: swap; src: url("/assets/fonts/pretendard-700.woff") format("woff"); }
  @font-face { font-family: "Pretendard"; font-weight: 800; font-display: swap; src: url("/assets/fonts/pretendard-800.woff") format("woff"); }
  @font-face { font-family: "Archivo Black"; font-display: swap; src: url("/assets/fonts/archivo-black.woff") format("woff"); }

  :root {
    color-scheme: light;
    --wall: #F7F8FA;
    --ink: #141417;
    --muted: #6B6E76;
    --accent: #5B84AA;
    --line: #DDE1E8;
    --sans: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    --num: "Archivo Black", "Pretendard", sans-serif;
    --ease-out: cubic-bezier(.22, 1, .36, 1);
  }
  * { box-sizing: border-box; }
  html { background: var(--wall); }
  body { margin: 0; font: 500 16px/1.7 var(--sans); color: var(--ink); background: var(--wall); -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); }

  /* 히어로: 스크롤 길이만큼 컵이 줄어든다. 무대는 화면에 붙어 있다. */
  .hero { position: relative; height: 420svh; }
  .stage { position: sticky; top: 0; height: 100svh; overflow: hidden; }

  .cup { position: absolute; left: 50%; bottom: 0; height: min(60svh, 150vw); aspect-ratio: 720 / 1292; transform: translateX(-50%); }
  .cup img, .cup video {
    position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: bottom;
    opacity: 0;
    /* 사진 옆 가장자리 벽을 페이지 벽 색으로 녹인다(위쪽은 .cup 마스크, 앱 CupView와 같은 처리). */
    -webkit-mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0, #000 9%, #000 91%, transparent 100%);
  }
  .cup {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 16%);
    mask-image: linear-gradient(to bottom, transparent 0, #000 16%);
  }
  .cup video { transition: opacity .45s var(--ease-out); }

  .copy { position: absolute; left: 0; right: 0; top: 0; padding: max(28px, env(safe-area-inset-top)) 24px 0; }
  .brand { font-weight: 800; font-size: 15px; letter-spacing: -.01em; margin: 0; }
  h1 { font-weight: 800; font-size: clamp(30px, 8.4vw, 64px); line-height: 1.12; letter-spacing: -.02em; margin: 14px 0 0; }

  .meter { margin-top: 22px; }
  .side { display: flex; gap: 18px; margin: 0; padding: 0; border: 0; }
  .side button {
    font: 700 14px/1 var(--sans); color: var(--muted); background: none; border: 0; padding: 6px 0 8px;
    cursor: pointer; position: relative;
  }
  .side button[aria-pressed="true"] { color: var(--accent); }
  .side button[aria-pressed="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--accent); }
  .readout { display: flex; align-items: baseline; gap: 6px; margin-top: 6px; }
  .num { font-family: var(--num); font-size: clamp(64px, 19vw, 132px); line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .unit { font-family: var(--num); font-size: clamp(22px, 6vw, 40px); }
  .limit { color: var(--muted); font-size: 15px; margin-left: 6px; }

  /* 단계 문구: 줄 단위로 아래에서 밀려 올라온다(마스크 안에서만 움직임). */
  .lines { position: relative; height: 1.6em; margin-top: 12px; overflow: hidden; font-weight: 700; font-size: clamp(16px, 4.2vw, 20px); }
  .lines span { position: absolute; left: 0; top: 0; white-space: nowrap; transform: translateY(110%); transition: transform .5s var(--ease-out); }
  .lines span.on { transform: translateY(0); }
  .lines span.gone { transform: translateY(-110%); }

  /* 남은 양 막대: 오른쪽 가장자리의 가는 선. */
  .gauge { position: absolute; right: 14px; top: 22svh; bottom: 14svh; width: 2px; background: var(--line); }
  .gauge i { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); height: 100%; transform-origin: bottom; }

  @media (min-width: 900px) {
    .cup { left: auto; right: 6vw; transform: none; height: 94svh; }
    .copy { padding: 11svh 0 0 8vw; max-width: 46vw; }
    .gauge { right: 3vw; }
  }

  /* 히어로 아래: 지원 정보(2단계에서 다시 설계). */
  .info { max-width: 42rem; margin: 0 auto; padding: 72px 24px 64px; }
  .info h2 { font-weight: 800; font-size: 20px; letter-spacing: -.01em; margin: 40px 0 8px; }
  .info p { margin: 8px 0; color: #34363C; }
  footer { max-width: 42rem; margin: 0 auto; padding: 24px 24px 56px; border-top: 1px solid var(--line); color: var(--muted); font-size: 14px; }
  footer p { margin: 6px 0; }

  @media (prefers-reduced-motion: reduce) {
    .hero { height: auto; }
    .stage { position: relative; }
    .lines span { transition: none; }
    .cup video { display: none; }
  }
</style>
</head>
<body>
<section class="hero" aria-label="소개">
  <div class="stage">
    <div class="cup" id="cup" aria-hidden="true"></div>
    <div class="copy">
      <p class="brand">슈가캡</p>
      <h1>마실 때마다<br>줄어드는 컵</h1>
      <div class="meter">
        <div class="side" role="group" aria-label="보기">
          <button type="button" data-side="sugar" aria-pressed="true">오늘 남은 당</button>
          <button type="button" data-side="caffeine" aria-pressed="false">오늘 남은 카페인</button>
        </div>
        <div class="readout" aria-live="off">
          <span class="num" id="num">50</span><span class="unit" id="unit">g</span><span class="limit" id="limit">/50 g</span>
        </div>
        <div class="lines" id="lines">
          <span data-from="1">하루치를 컵 한 잔으로 보여줘요.</span>
          <span data-from="0.7">마실 때마다 기록하면 컵이 줄어요.</span>
          <span data-from="0.35">남은 만큼은 밤에 로슈와 카인에게.</span>
        </div>
      </div>
    </div>
    <div class="gauge" aria-hidden="true"><i id="gauge"></i></div>
  </div>
</section>

<main class="info">
  <h2>지원</h2>
  <p>앱 사용 중 문제가 있거나 제안이 있으면 아래로 보내 주세요. 보통 2~3일 안에 답합니다.</p>
  <p><a href="mailto:windgarden05@gmail.com">windgarden05@gmail.com</a></p>

  <h2>수치의 출처</h2>
  <p>카페 메뉴의 당·카페인 수치는 각 브랜드가 공식 홈페이지에 공개한 값을 옮긴 것입니다. 브랜드가 공개하지 않은 값은 "미공개"로 표시하며 추정하지 않습니다.</p>
</main>
<footer>
  <p><a href="/privacy/">개인정보처리방침</a></p>
  <p>슈가캡 · 계정도 서버도 없는 기록 앱</p>
</footer>

<script>
(() => {
  // 앱 CupLevel과 같은 5단계·경계값(SPEC §9-10).
  const STEPS = [0, 30, 50, 80, 100];
  const SIDES = {
    sugar: { set: "latte", limit: 50, unit: "g" },
    caffeine: { set: "americano", limit: 400, unit: "mg" },
  };
  const FADE = 0.04; // 경계 앞뒤로 이만큼(남은 비율) 겹쳐 크로스페이드
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  const cup = document.getElementById("cup");
  const num = document.getElementById("num");
  const unit = document.getElementById("unit");
  const limitEl = document.getElementById("limit");
  const gauge = document.getElementById("gauge");
  const hero = document.querySelector(".hero");
  const lines = [...document.querySelectorAll("#lines span")];

  // 두 세트의 단계 사진을 모두 겹쳐 둔다(사진은 장당 15~45KB).
  const layers = {};
  for (const side of Object.values(SIDES)) {
    layers[side.set] = {};
    for (const step of STEPS) {
      const img = new Image();
      img.src = `/assets/cups/${side.set}-${step}.webp`;
      img.alt = "";
      img.decoding = "async";
      cup.appendChild(img);
      layers[side.set][step] = img;
    }
  }
  const video = document.createElement("video");
  video.muted = true; video.loop = true; video.playsInline = true; video.setAttribute("playsinline", "");
  cup.appendChild(video);

  let side = "sugar";
  let current = { set: null, step: null };

  // 남은 비율 → 단계(앱 CupLevel.step과 같은 경계).
  // 첫 화면이 가득 찬 잔으로 시작하도록 100% 구간만 앱보다 넓혔다(0.9 이상).
  const stepFor = (r) => r <= 0.06 ? 0 : r >= 0.9 ? 100 : r < 0.40 ? 30 : r < 0.65 ? 50 : 80;
  const BOUNDS = [[0.06, 0, 30], [0.40, 30, 50], [0.65, 50, 80], [0.9, 80, 100]];

  function progress() {
    if (reduce) return 0.5;
    const rect = hero.getBoundingClientRect();
    const span = hero.offsetHeight - innerHeight;
    return Math.min(1, Math.max(0, -rect.top / span));
  }

  function render() {
    const p = progress();
    const r = 1 - p;
    const s = SIDES[side];
    num.textContent = Math.round(s.limit * r);
    gauge.style.transform = `scaleY(${r})`;

    // 단계별 불투명도: 기본은 현재 단계만 1, 경계 근처에서는 두 단계를 겹친다.
    const step = stepFor(r);
    const alpha = Object.fromEntries(STEPS.map((k) => [k, k === step ? 1 : 0]));
    if (!reduce) {
      for (const [edge, lo, hi] of BOUNDS) {
        const d = r - edge;
        if (Math.abs(d) < FADE) {
          const t = (d + FADE) / (2 * FADE); // 0 = 낮은 단계, 1 = 높은 단계
          alpha[lo] = 1 - t; alpha[hi] = t;
          for (const k of STEPS) if (k !== lo && k !== hi) alpha[k] = 0;
        }
      }
    }
    for (const [set, byStep] of Object.entries(layers)) {
      for (const k of STEPS) byStep[k].style.opacity = set === s.set ? alpha[k] : 0;
    }

    // 문구: 남은 비율이 지나간 줄 중 마지막 것.
    let active = 0;
    lines.forEach((el, i) => { if (r <= Number(el.dataset.from)) active = i; });
    lines.forEach((el, i) => {
      el.classList.toggle("on", i === active);
      el.classList.toggle("gone", i < active);
    });

    if (current.set !== s.set || current.step !== step) {
      current = { set: s.set, step };
      hideIdle();
    }
  }

  // 대기 루프: 스크롤이 멈추면 그 단계의 얼음 영상을 사진 위에 올린다(0%는 빈 잔이라 없음).
  let idleTimer = 0;
  function hideIdle() {
    video.style.opacity = 0;
    video.pause();
  }
  function showIdle() {
    if (reduce || current.step === 0) return;
    const src = `/assets/cups/${current.set}-${current.step}-idle.mp4`;
    if (!video.src.endsWith(src)) { video.src = src; video.currentTime = 0; }
    video.play().then(() => { video.style.opacity = 1; }).catch(() => {});
  }
  function onScroll() {
    render();
    hideIdle();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showIdle, 380);
  }

  document.querySelectorAll(".side button").forEach((b) => b.addEventListener("click", () => {
    side = b.dataset.side;
    document.querySelectorAll(".side button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    const s = SIDES[side];
    unit.textContent = s.unit;
    limitEl.textContent = `/${s.limit} ${s.unit}`;
    render();
    clearTimeout(idleTimer);
    idleTimer = setTimeout(showIdle, 380);
  }));

  let ticking = false;
  addEventListener("scroll", () => {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(() => { ticking = false; onScroll(); });
  }, { passive: true });
  addEventListener("resize", render);
  render();
  idleTimer = setTimeout(showIdle, 600);
})();
</script>
</body>
</html>
